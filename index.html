<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Renal Medicine · For Musliha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Great+Vibes&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf8ee; --card:#ffffff; --ink:#17302c; --mute:#5d7872; --line:#eadfc7;
  --teal:#0f766e; --teal2:#14b8a6; --deep:#064e46; --gold:#c8962e; --gold2:#f4d27a;
  --rose:#e11d74; --ok:#15803d; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2;
  --warn:#a16207; --warnbg:#fef3c7; --shadow:0 10px 30px rgba(15,118,110,.12);
  --r:20px;
  --l1:#e11d48; --l2:#0ea5e9; --l3:#f59e0b; --l4:#8b5cf6; --l5:#ef4444;
  --l6:#ec4899; --l7:#14b8a6; --l8:#0f766e; --l9:#6366f1; --lT:#b45309;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;
  background-image:radial-gradient(circle at 10% 0%,#fff6dc 0,transparent 40%),radial-gradient(circle at 100% 30%,#e3f7f2 0,transparent 35%);background-attachment:fixed}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}

/* hero */
.hero{position:relative;overflow:hidden;color:#fff;padding:34px 0 64px;
  background:linear-gradient(135deg,#053f39 0%,#0f766e 55%,#27b7a3 100%)}
.hero::before{content:"";position:absolute;inset:0;opacity:.55;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='72' height='72'><g fill='none' stroke='white' stroke-opacity='.13' stroke-width='1.2'><rect x='18' y='18' width='36' height='36'/><rect x='18' y='18' width='36' height='36' transform='rotate(45 36 36)'/><circle cx='36' cy='36' r='5'/></g></svg>")}
.orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.5;animation:float 9s ease-in-out infinite}
.orb.a{width:150px;height:150px;right:-30px;top:-30px;background:radial-gradient(circle,var(--gold2),transparent 70%)}
.orb.b{width:110px;height:110px;left:8%;bottom:-20px;background:radial-gradient(circle,#fff,transparent 70%);animation-delay:-3s}
.orb.c{width:70px;height:70px;right:20%;bottom:30px;background:radial-gradient(circle,var(--gold2),transparent 70%);animation-delay:-6s}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-16px) scale(1.06)}}
.hero .wrap{position:relative;text-align:center}
.pill{display:inline-block;padding:5px 14px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);font-size:.78rem;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;animation:fadeUp .8s both}
.ayah{font-family:"Amiri","Scheherazade New","Traditional Arabic",serif;font-size:clamp(1.9rem,6.4vw,2.9rem);line-height:1.6;margin:16px 0 2px;color:var(--gold2);text-shadow:0 2px 14px rgba(0,0,0,.25);animation:fadeUp .9s .15s both}
.trans{font-size:clamp(1.05rem,3.6vw,1.3rem);font-weight:700;margin:0;animation:fadeUp .9s .3s both}
.cite{opacity:.85;font-size:.85rem;margin:2px 0 14px;animation:fadeUp .9s .4s both}
.sub{max-width:520px;margin:0 auto;opacity:.95;animation:fadeUp .9s .5s both}
.for{font-family:"Great Vibes","Brush Script MT",cursive;font-size:clamp(2.4rem,9vw,3.6rem);line-height:1.15;margin:16px 0 0;animation:fadeUp .9s .65s both}
.for .nm{background:linear-gradient(90deg,#fff 0%,var(--gold2) 40%,#fff 60%,var(--gold2) 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shimmer 5s 1.6s linear infinite}
@keyframes shimmer{to{background-position:-220% 0}}
.heart{display:inline-block;font-family:system-ui,sans-serif;font-size:.6em;vertical-align:middle;color:#ffb4cf;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}20%{transform:scale(1.25)}40%{transform:scale(1)}}
.wave{position:absolute;left:0;right:0;bottom:-1px;height:40px;background:var(--bg);clip-path:ellipse(60% 100% at 50% 100%)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* nav */
nav{position:sticky;top:0;z-index:20;background:rgba(253,248,238,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:6px;overflow-x:auto;padding:9px 16px;scrollbar-width:none}
nav .wrap::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:0;background:transparent;color:var(--mute);padding:8px 14px;border-radius:999px;font:700 .92rem "Nunito",sans-serif;cursor:pointer;white-space:nowrap;transition:all .25s}
nav button:hover{background:#f3ead5;color:var(--deep)}
nav button.on{background:linear-gradient(120deg,var(--teal),var(--teal2));color:#fff;box-shadow:0 4px 12px rgba(15,118,110,.3)}
main{padding:20px 0 90px;margin-top:-8px}
.page{animation:fadeUp .45s both}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0 0 16px;box-shadow:var(--shadow)}
h2{margin:.2em 0 .1em;font-size:1.4rem;color:var(--deep)}
h3{margin:0 0 6px;color:var(--deep)}
.hint{color:var(--mute);font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 16px}
.stat{position:relative;overflow:hidden;border-radius:18px;padding:16px;color:#fff;box-shadow:var(--shadow);animation:fadeUp .6s both}
.stat:nth-child(2){animation-delay:.08s}.stat:nth-child(3){animation-delay:.16s}.stat:nth-child(4){animation-delay:.24s}
.stat b{display:block;font-size:2rem;line-height:1.1}
.stat::after{content:"";position:absolute;right:-20px;bottom:-24px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.18)}
.s1{background:linear-gradient(135deg,#0f766e,#14b8a6)}.s2{background:linear-gradient(135deg,#c8962e,#f0c35c)}
.s3{background:linear-gradient(135deg,#be185d,#f472b6)}.s4{background:linear-gradient(135deg,#4f46e5,#818cf8)}
.ring{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ring svg{flex:0 0 auto}
.ring circle.bg{stroke:#efe6cf}.ring circle.fg{stroke:url(#g);stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{border:0;border-radius:14px;padding:11px 18px;font:800 .95rem "Nunito",sans-serif;cursor:pointer;background:#f3ead5;color:var(--deep);transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.1)}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(120deg,var(--teal),var(--teal2));color:#fff;box-shadow:0 6px 16px rgba(15,118,110,.3)}
.btn.gold{background:linear-gradient(120deg,#c8962e,#f0c35c);color:#3a2a05}
.btn:disabled{opacity:.4;pointer-events:none}

/* chips & filters */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 12px}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:5px 12px;border-radius:999px;font-size:.84rem;font-weight:700;cursor:pointer;transition:all .2s;--c:var(--teal)}
.chip:hover{border-color:var(--c)}
.chip.on{background:var(--c);border-color:var(--c);color:#fff;animation:pop .3s}
input[type=search]{width:100%;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font:600 1rem "Nunito",sans-serif;outline:none}
input[type=search]:focus{border-color:var(--teal2);box-shadow:0 0 0 4px rgba(20,184,166,.15)}

/* viewer */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.bar{height:8px;background:#efe6cf;border-radius:99px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal2),var(--gold));border-radius:99px;transition:width .5s}
details summary{cursor:pointer;font-weight:700;color:var(--teal);margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin:10px 0 2px}
.dot{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:7px 0;font:700 .82rem "Nunito",sans-serif;cursor:pointer;position:relative;transition:transform .15s}
.dot:hover{transform:scale(1.08)}
.dot.cur{outline:2px solid var(--teal);outline-offset:1px}
.dot.ok{background:var(--okbg);border-color:var(--ok)}.dot.no{background:var(--badbg);border-color:var(--bad)}
.dot.fl::after{content:"⚑";position:absolute;top:-6px;right:1px;font-size:.72rem;color:var(--rose)}
.qcard{position:relative;border-top:5px solid var(--lc,var(--teal))}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.b{font-size:.72rem;font-weight:800;padding:3px 10px;border-radius:999px;background:#f3ead5;color:var(--mute)}
.b.lec{background:var(--lc);color:#fff}
.b.ok{background:var(--okbg);color:var(--ok)}.b.chk{background:var(--warnbg);color:var(--warn)}
.b.tb{background:#ffedd5;color:#9a3412}.b.rep{background:#fce7f3;color:#be185d}
.topic{color:var(--mute);font-weight:700;font-size:.9rem}
.stem{font-size:1.08rem;font-weight:800;margin:4px 0 14px;white-space:pre-line}
.opt{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:16px;padding:11px 13px;margin:9px 0;background:#fff;transition:border-color .2s,background .2s,transform .15s}
.opt .l{flex:0 0 30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:.88rem}
.opt .tx{flex:1;min-width:0}
.sba{cursor:pointer}.sba:hover{border-color:var(--teal2);transform:translateX(3px)}
.opt.pick{border-color:var(--teal);background:#e8f8f5}
.opt.good{border-color:var(--ok);background:var(--okbg);animation:pop .4s}
.opt.bad{border-color:var(--bad);background:var(--badbg);animation:shake .4s}
.opt.unans{border-color:var(--gold);background:#fff8e6}
.tf{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.tf button{border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:6px 20px;font:800 .9rem "Nunito",sans-serif;cursor:pointer;transition:all .2s}
.tf button:hover{border-color:var(--teal2)}
.tf button.sel{background:var(--teal);border-color:var(--teal);color:#fff;animation:pop .25s}
.tf button:disabled{cursor:default;opacity:.85}
.key{font-size:.85rem;font-weight:800;padding:2px 10px;border-radius:99px;background:#fff;border:1.5px solid currentColor}
.chkmark{font-size:.78rem;font-weight:800;color:var(--warn);background:var(--warnbg);padding:2px 9px;border-radius:99px}
.verdict{font-weight:800;margin-top:14px;font-size:1.05rem}
.exp{margin-top:12px;border-left:5px solid var(--gold);background:#fffaf0;padding:8px 14px;border-radius:0 14px 14px 0;animation:fadeUp .4s both}
.exp h4{margin:10px 0 2px;font-size:.74rem;text-transform:uppercase;letter-spacing:.8px;color:var(--gold)}
.exp p{margin:0}
.warnbox{background:var(--warnbg);color:#7c4a03;border-radius:14px;padding:9px 13px;margin-top:10px;font-size:.93rem}
.final{margin-top:14px}

/* tables / lists */
.hot{display:grid;gap:12px}
.hotitem{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.times{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.3rem;background:linear-gradient(135deg,var(--rose),#fb7185)}
.hotitem small{display:block;color:var(--mute)}
a.q{display:inline-block;margin:3px 4px 0 0;padding:2px 10px;border-radius:99px;background:#e8f8f5;color:var(--teal);font-weight:800;font-size:.85rem;cursor:pointer;text-decoration:none}
a.q:hover{background:var(--teal);color:#fff}
.lecgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.lec{border-radius:18px;padding:16px;background:#fff;border:1px solid var(--line);border-left:6px solid var(--lc);box-shadow:var(--shadow);animation:fadeUp .5s both}
.lec b{font-size:1.05rem}
.notesoon{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:99px;background:#fff3d1;color:#8a6410;font-size:.78rem;font-weight:800}
.notes h2,.notes h3{color:var(--teal)}.notes li{margin:3px 0}
.empty{text-align:center;color:var(--mute);padding:34px 12px}
footer{text-align:center;color:var(--mute);padding:10px 16px 40px;font-size:.92rem}
footer .fr{font-family:"Great Vibes",cursive;font-size:1.8rem;color:var(--gold)}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:10px 20px;border-radius:99px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:101;animation:fadeUp .3s both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{.hero,nav,.btn,.btnrow,footer{display:none}}
</style>
</head>

ng or estimating the GFR\", p. 1346 and Box 36.5.", "confidence": "CHECK on B, E. For B, the lecture is silent and the textbook lists inulin clearance as an alternative for true GFR without using the words \"gold standard\" (standard knowledge). For E, the lecture says CKD-EPI is preferred but not what the routine lab uses, and the item says \"measured\". Best answer is B True, E True.", "check": true, "checkLetters": ["B", "E"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 4, "batch": "29th Batch Q40", "bn": 29, "topic": "Calculation of GFR", "type": "MTF", "lecture": "8", "stem": "Regarding the calculation of GFR, (MTF)", "options": {"A": "Creatinine clearance is calculated by a 24 hour urine collection", "B": "eGFR calculation is done using urine creatinine concentration and age of the patient", "C": "GFR depends on the body surface", "D": "Males have higher eGFR due to increased muscle mass", "E": "Urine creatine measurement is needed for MDRD calculation"}, "answer": {"A": true, "B": false, "C": true, "D": true, "E": false}, "explanation": "Creatinine clearance needs a 24-hour collection. eGFR equations (MDRD, CKD-EPI) use serum creatinine, age and sex, not urine creatinine, so B and E are false (the printed \"creatine\" in E is a typo). GFR is indexed to body surface area. Kumar & Clark say creatinine relates to age, sex and muscle mass, and give a higher normal creatinine clearance in men (90-140 mL/min) than in women (80-125 mL/min).", "source": "Lecture 8 Chronic Kidney Disease, \"Estimating GFR\" slide. Kumar & Clark Ch. 36, \"Glomerular filtration rate\" and \"Measuring or estimating the GFR\", p. 1346 and Box 36.5.", "confidence": "CHECK on D. The textbook supports the sex difference and the muscle-mass link, but the lecture is silent and the causal wording is loose. Best answer is D True.", "check": true, "checkLetters": ["D"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 5, "batch": "28th Batch Q66", "bn": 28, "topic": "Creatinine clearance 50 mL/min interpretation", "type": "SBA", "lecture": "8", "stem": "A patient tested creatinine clearance using 24-hour urine collection method. Result was 50mL/min. What is the most accurate of the following? (SBA)", "options": {"A": "Cannot comment without knowing surface area and age", "B": "In patient with diabetes mellitus urine micro-albumin must be performed at this stage.", "C": "MDRD (modification of diet in renal disease) equation has been needed for the above calculation.", "D": "This patient has chronic kidney disease.", "E": "This value is normal."}, "answer": "A", "explanation": "GFR categories are defined per 1.73 m², and Kumar & Clark note that 50-60 mL/min can be normal over 80 years of age, so a raw 50 mL/min cannot be labelled without body size and age. The lecture defines CKD as kidney damage for 3 months or more, so a single value cannot confirm D. C is wrong because MDRD is an estimating equation from serum creatinine, age and sex, and is not used to calculate a measured 24-hour clearance. B and E are not supported by the value alone.", "source": "Lecture 8 Chronic Kidney Disease, \"What is CKD?\", \"Classification of CKD (KDIGO)\" and \"Estimating GFR\" slides. Kumar & Clark Ch. 36, \"Measuring or estimating the GFR\", p. 1346, and \"The urinary tract in the elderly\".", "confidence": "CHECK on D. A setter may intend 50 mL/min to mean CKD (below 60), but persistence and body-surface correction are not given. Best answer is A.", "check": true, "checkLetters": ["D"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 6, "batch": "27th Batch Q40", "bn": 27, "topic": "GFR", "type": "MTF", "lecture": "8", "stem": "Glomerular filtration rate (GFR), (MTF)", "options": {"A": "Calculated by CKD - EPI method", "B": "Calculated by MDRD formula", "C": "Chronic renal failure is categorized according to the eGFR", "D": "Increase in elderly", "E": "Inulin is normally used for measure GFR.."}, "answer": {"A": true, "B": true, "C": true, "D": false, "E": false}, "explanation": "The lecture lists MDRD and CKD-EPI (preferred) as the eGFR equations, and KDIGO stages CKD by GFR category (G1-G5) together with albuminuria category (A1-A3). GFR falls with age rather than rising, because glomeruli scar and atherosclerotic renovascular disease develops. Inulin clearance is a reference method for true GFR, but Kumar & Clark say it is not practical for daily clinical practice, so it is not \"normally used\". This is consistent with Q3, where inulin is the reference marker but not a routine test.", "source": "Lecture 8 Chronic Kidney Disease, \"Classification of CKD (KDIGO)\" and \"Estimating GFR\" slides. Kumar & Clark Ch. 36, \"Measuring or estimating the GFR\", p. 1346, and \"The urinary tract in the elderly\".", "confidence": "CHECK on E. The word \"normally\" is a judgement call, and the lecture is silent on inulin. Best answer is E False.", "check": true, "checkLetters": ["E"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 7, "batch": "26th Batch Q26", "bn": 26, "topic": "Creatinine clearance test", "type": "MTF", "lecture": "8", "stem": "Regarding creatinine clearance test, (MTF)", "options": {"A": "Is high with increased water consumption.", "B": "Prior hospital admission is a must.", "C": "24 hour urine collection is a must.", "D": "Reference range for children is less than adults.", "E": "Two serum samples are needed for the test."}, "answer": {"A": false, "B": false, "C": true, "D": true, "E": false}, "explanation": "The test needs a 24-hour urine collection paired with a single plasma creatinine measured during that period, so C is true and E is false. Admission is not required, and creatinine clearance does not rise with water intake because it reflects GFR, not urine flow (standard knowledge). In absolute mL/min the value is lower in children because of their smaller size; the lecture and textbook give no paediatric range, so this is standard knowledge. Per 1.73 m² the values are similar, which is why Q8 option C (\"higher in children\") is false.", "source": "Lecture 8 Chronic Kidney Disease, \"Estimating GFR\" slide (24-hour creatinine clearance). Kumar & Clark Ch. 36, \"Measuring or estimating the GFR\", p. 1346 (24-hour collection, single plasma creatinine, adult normal ranges).", "confidence": "CHECK on D. The lecture and textbook give no paediatric reference range, and the answer depends on absolute versus body-surface-corrected values. Best answer is D True.", "check": true, "checkLetters": ["D"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 8, "batch": "25th Batch Q40", "bn": 25, "topic": "GFR", "type": "MTF", "lecture": "8", "stem": "Which of the following is/are true or false regarding glomerular filtration rate ? (MTF)", "options": {"A": "Iothalamate is a better marker than creatinine in the assessment.", "B": "It depends on the body surface area.", "C": "It is higher in children.", "D": "It is increased in pregnancy.", "E": "It is overestimated when measured by creatinine clearance."}, "answer": {"A": true, "B": true, "C": false, "D": true, "E": true}, "explanation": "Exogenous filtration markers (inulin, iohexol, 51Cr-EDTA, iothalamate) measure true GFR more accurately than creatinine, but are impractical for routine use. GFR is indexed to 1.73 m² body surface area, and Kumar & Clark list pregnancy as raising GFR. Creatinine is also secreted by the proximal tubule, so creatinine clearance overestimates true GFR. Option C is false: once indexed to body surface area, children's values are not higher (see Q7 D).", "source": "Lecture 8 Chronic Kidney Disease, \"Estimating GFR\" slide. Kumar & Clark Ch. 36, \"Measuring or estimating the GFR\", p. 1346, and Box 36.4 (pregnancy raises GFR).", "confidence": "CHECK on A, E. For A, iothalamate is not named in the lecture or textbook; the textbook names inulin, iohexol and 51Cr-EDTA (the A answer is standard knowledge). For E, tubular secretion of creatinine is standard knowledge, not in the lecture. Best answer is A True, E True.", "check": true, "checkLetters": ["A", "E"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 9, "batch": "33rd Batch Q4", "bn": 33, "topic": "Haematuria: general", "type": "MTF", "lecture": "1", "stem": "Regarding hematuria,", "options": {"A": "Transient microscopic hematuria after exercises in young men need no investigations.", "B": "Hematuria due to glomerular pathologies is recognized by the presence of red cell casts.", "C": "All patients above 50 years with macroscopic hematuria must undergo cystoscopy.", "D": "Bladder malignancy can be excluded by ultrasound scan.", "E": "IgA nephropathy typically presents with macroscopic hematuria following an upper respiratory tract infection."}, "answer": {"A": true, "B": true, "C": true, "D": false, "E": true}, "explanation": "The lecture lists exercise haematuria as a physiological cause. Microscopic haematuria is repeated at 2 weeks and evaluated only if it persists, so a transient post-exercise finding needs no work-up (the stem has the grammar slip \"need\" for \"needs\"). Red cell casts and dysmorphic red cells mean glomerular bleeding. Cystoscopy is mandatory in all macroscopic haematuria, which includes patients over 50. Ultrasound is less sensitive than CT and cystoscopy for bladder cancer, so it cannot exclude it; cystoscopy is the only definitive test. IgA nephropathy presents with recurrent macroscopic haematuria, often after an upper respiratory or GI viral infection.", "source": "1Haematuria lecture: \"Physiological Causes of Hematuria\", \"Hematuria is a significant finding that requires further evaluation\", \"When to Refer to a Nephrologist\", \"USS KUB\", \"Cystoscopy\"; 04Glomerulonephritis lecture: \"IgA Nephropathy – Clinical Features\". Kumar & Clark p. 1349 and p. 1362.", "confidence": "CHECK on A. The lecture supports \"no further evaluation if transient\", but it still says to repeat the urinalysis at 2 weeks, so \"no investigations\" is slightly overstated. Best answer is True.", "check": true, "checkLetters": ["A"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 10, "batch": "31st Batch Q5", "bn": 31, "topic": "Haematuria: general", "type": "MTF", "lecture": "1", "stem": "Regarding hematuria,", "options": {"A": "Normal appearance of urine excludes hematuria.", "B": "Presence of red cell casts suggestive of glomerulonephritis.", "C": "Renal biopsy is indicated in the presence of unexplained hematuria with proteinuria.", "D": "Hematuria with loin pain is a known suggestive feature of renal infarction.", "E": "Intravascular hemolysis is a cause of hematuria."}, "answer": {"A": false, "B": true, "C": true, "D": true, "E": false}, "explanation": "Microscopic haematuria is not visible and is found only on dipstick or microscopy, so normal-looking urine does not exclude it. Red cell casts indicate glomerular bleeding, and the lecture lists infarction under painful haematuria. The lecture does not state the biopsy indication in these exact words. It does say biopsy looks for conditions such as glomerulonephritis, and that proteinuria with glomerular bleeding goes to a nephrologist. Intravascular haemolysis gives haemoglobinuria, with no intact red cells on microscopy, so it is not a cause of true haematuria (stem B lacks \"is\").", "source": "1Haematuria lecture: \"What is Hematuria?\", \"Painful Hematuria\", \"Other tests\", \"When to Refer to a Nephrologist\"; 8Chronic Kidney Disease lecture: \"Indications for Renal Biopsy\". Kumar & Clark p. 1349 (haemoglobinuria). The point on haemolysis is textbook plus standard knowledge, as the lecture is silent.", "confidence": "CHECK on C and E. C: the lecture supports it in general terms but does not state this exact indication. E: the lecture never lists haemolysis, and the answer rests on the strict definition of haematuria as red cells in urine. Best answer is C True, E False.", "check": true, "checkLetters": ["C", "E"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null, "printedAlso": ["29th Batch Q26"]}, {"id": 12, "batch": "27th Batch Q27", "bn": 27, "topic": "Causes of microscopic haematuria", "type": "MTF", "lecture": "1", "stem": "Microscopic haematuria is an expected finding in", "options": {"A": "Acute glomerulonephritis", "B": "Diabetic nephropathy", "C": "Infective endocarditis", "D": "Membranous glomerulopathy", "E": "Renal tuberculosis"}, "answer": {"A": true, "B": false, "C": true, "D": true, "E": true}, "explanation": "Acute GN is a nephritic syndrome with microscopic or macroscopic haematuria and red-cell casts. Infective endocarditis causes a focal, segmental GN resembling post-infectious GN. The haematuria lecture lists tuberculosis among the infective renal causes. The nephrotic lecture says some patients with membranous glomerulopathy have microscopic haematuria, which is why D is True. For diabetic nephropathy, the lecture treats red-cell casts or an active sediment as a pointer to a non-diabetic cause, so haematuria is not an expected feature.", "source": "1Haematuria lecture: \"Glomerular Causes\", \"Tubulo-Interstitial Causes\"; 04Glomerulonephritis lecture: \"Infective Endocarditis & Shunt Nephritis\"; 3Nephrotic Syndrome lecture: \"Membranous glomerulopathy – Clinical Features\"; 7Systemic Disease lecture: \"Investigation of microalbuminuria and proteinuria\". Kumar & Clark p. 1360 and Box 36.14.", "confidence": "CHECK on B and D. B: the lecture is silent on haematuria in diabetic nephropathy, so False is inferred (standard knowledge). D: the lecture says haematuria occurs \"in some\" membranous cases, which is weaker than \"expected\". Best answer is B False, D True.", "check": true, "checkLetters": ["B", "D"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 13, "batch": "26th Batch Q38", "bn": 26, "topic": "Haematuria: general", "type": "MTF", "lecture": "1", "stem": "Regarding hematuria,", "options": {"A": "The presence of dysmorphic RBC indicates renal origin of hematuria.", "B": "Presence of less than 5 RBC per hpf is not significant in male.", "C": "Presence of red cell casts indicates a renal origin.", "D": "Urinary tract infections can cause hematuria.", "E": "X Ray KUB plays an important role in identifying the cause of hematuria"}, "answer": {"A": true, "B": false, "C": true, "D": true, "E": true}, "explanation": "Dysmorphic red cells and red cell casts both indicate glomerular, therefore renal, bleeding. The lecture defines haematuria as more than 3 RBC/hpf with no separate threshold for males, so 3 to 5 RBC/hpf is still significant. UTI and pyelonephritis are listed as causes of haematuria. X-ray KUB is listed first among the imaging tests and shows about 90% of calculi, so it has a real role, although USS and CT now lead the work-up.", "source": "1Haematuria lecture: \"What is Hematuria?\", \"Dysmorphic red cells in urine\", \"Painful Hematuria\", \"Investigating Hematuria – Imaging\", \"Imaging of the GU tract\". Kumar & Clark p. 1349 and p. 1382.", "confidence": "CHECK on E. \"Important role\" is a judgement; the lecture lists X-ray KUB as the first imaging test and says it shows 90% of calculi, but also prefers USS or CT. Best answer is True.", "check": true, "checkLetters": ["E"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 14, "batch": "30th Batch Q15", "bn": 30, "topic": "AKI causes matched to presentations", "type": "MTF", "lecture": "5", "stem": "A 40-year-old man presented with oliguria and was suspected to have AKI (acute kidney injury). Which of the following clinical presentations match the given causes of AKI?", "options": {"A": "Febrile illness with jaundice - Leptospirosis", "B": "BP 200/130 mmHg with grade 4 hypertensive retinopathy - Malignant hypertension", "C": "Gross hematuria - IgA nephropathy", "D": "Vasculitic rash- Infective endocarditis", "E": "Scabies impetigo - Post streptococcal glomerulonephritis"}, "answer": {"A": true, "B": true, "C": true, "D": true, "E": true}, "explanation": "Each pairing is a recognised cause of AKI. The lecture covers infective endocarditis (Staph aureus can cause crescentic GN with AKI) and post-streptococcal GN (preceding infection 1-3 weeks earlier). It also names Leptospira MAT testing in endemic areas. Fever with jaundice for leptospirosis, grade 4 retinopathy for malignant hypertension and impetigo as a streptococcal trigger are standard knowledge, not on the slides. The weakest link is C, because gross haematuria is the classic IgA presentation but AKI is an uncommon one.", "source": "5AKI lecture, Causes of intra-renal AKI and Investigation of AKI (Leptospira MAT). 04Glomerulonephritis lecture, Post-Streptococcal GN, Infective Endocarditis and Shunt Nephritis, IgA Nephropathy clinical features. Kumar & Clark p. 1361 and pp. 1370-1371.", "confidence": "CHECK on C. The lecture does not list IgA nephropathy as a cause of AKI, only as a cause of macroscopic haematuria. Best answer is True.", "check": true, "checkLetters": ["C"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 15, "batch": "30th Batch Q16", "bn": 30, "topic": "Features of severe dehydration", "type": "MTF", "lecture": "5", "stem": "Features of severe dehydration which can be seen in a previously healthy man", "options": {"A": "Tachycardia", "B": "Capillary refill time is 7 sec", "C": "Drowsy", "D": "Urine output less than 0.5ml/kg/hr", "E": "Postural hypotension"}, "answer": {"A": true, "B": true, "C": true, "D": true, "E": true}, "explanation": "Severe volume depletion causes a compensatory tachycardia, postural hypotension, low JVP and oliguria. Drowsiness and a markedly prolonged capillary refill time (normal is under 2 seconds) reflect poor perfusion. Urine output under 0.5 mL/kg/h is the KDIGO oliguria threshold in the lecture and is expected in pre-renal AKI from dehydration. The lecture does not give a capillary refill cut-off, so B, A and C rest on standard knowledge.", "source": "5AKI lecture, KDIGO criteria and Clinical Presentation, physical signs (volume status). Kumar & Clark Box 36.33 (hypovolaemia: postural hypotension, low JVP).", "confidence": "CHECK on B. Neither the lecture nor the textbook gives a capillary refill time; 7 seconds is clearly abnormal by standard knowledge. Best answer is True.", "check": true, "checkLetters": ["B"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 16, "batch": "28th Batch Q29", "bn": 28, "topic": "Cause of AKI after fever and antibiotics", "type": "MTF", "lecture": "5", "stem": "A 50-year-old man with 10 days fever treated antibiotics 3 days ago develop AKI. Urine full report proteinuria (++) with no WBC, 20 RBCs per hpf Reason for AKI", "options": {"A": "Drug induced Acute tubular necrosis", "B": "Leptospirosis", "C": "Ischemic ATN due to hypovolemia", "D": "Infective endocarditis", "E": "Rapidly progressive glomerulonephritis"}, "answer": {"A": false, "B": true, "C": false, "D": true, "E": false}, "explanation": "Proteinuria with red cells and no white cells suggests a glomerular or vascular injury rather than interstitial disease or infection of the tract. Ten days of fever fits leptospirosis (lecture: Leptospira MAT in endemic areas) and infective endocarditis (lecture: immune-complex GN, crescentic with Staph aureus). ATN usually gives a bland sediment with granular casts and little haematuria (standard knowledge), and nothing in the stem points to hypovolaemia. RPGN evolves over weeks, so it is the least likely here.", "source": "5AKI lecture, Causes of intra-renal AKI and Investigation of AKI (Leptospira MAT). 04Glomerulonephritis lecture, Infective Endocarditis and Shunt Nephritis. Kumar & Clark p. 1361 and the infection-causing acute TIN section (Leptospira) around p. 1386.", "confidence": "CHECK on A and E. A drug-induced ATN is possible because antibiotics were given and the lecture gives no urine sediment findings for ATN. E is possible because infective endocarditis can cause crescentic GN. Best answer is A False, E False.", "check": true, "checkLetters": ["A", "E"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 17, "batch": "28th Batch Q59", "bn": 28, "topic": "Cause of hyperkalaemia on ACEI and spironolactone", "type": "SBA", "lecture": "5", "stem": "A 60-year-old man with known hypertensive on ACEI present to the medical casualty ward with weakness. He is on statin for hypercholesteremia, carvedilol and spironolactone for chronic heart failure and insulin for DM. His BP is 130/80 mmHg. What is the main cause for his hyperkalemia?\nSerum creatinine 1.4mg/dl (0.8-1.2)\nSerum potassium 7.2 mmol/l (2.5-5.5)\nBlood glucose 250 mg/dl (<180)\nCreatinine phosphokinase 300 U/L (30-308)", "options": {"A": "Drug induced action on renin angiotensin system", "B": "Statin induced rhabdomyolysis", "C": "Worsening heart failure", "D": "Worsening renal failure", "E": "Uncontrolled diabetes mellitus"}, "answer": "A", "explanation": "An ACE inhibitor combined with spironolactone blocks the renin-angiotensin-aldosterone axis at two points and reduces potassium excretion. That the two drugs together raise potassium is standard knowledge. The lecture lists ACEi among nephrotoxic drugs and hyperkalaemia as an AKI complication. The CK of 300 U/L is inside the printed range (30-308), which excludes rhabdomyolysis, and a creatinine of 1.4 mg/dl is only mildly raised. A glucose of 250 mg/dl without acidosis does not explain a potassium of 7.2.", "source": "5AKI lecture, Causes of intra-renal AKI (toxic ATN: ACEi) and Complications of AKI (hyperkalaemia). 8Chronic Kidney Disease lecture, SBA 3 (ACE inhibitor and hyperkalaemia).", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 18, "batch": "28th Batch Q60", "bn": 28, "topic": "NSAID-related acute interstitial nephritis", "type": "SBA", "lecture": "5", "stem": "A 45-year-old man on long term medication on non-steroidal anti-inflammatory drugs presents with fever and joint pain. His serum creatinine is 3.2 mg/dl. He has eosinophils in urine microscopy and no proteinuria. Which of the following is most possible diagnosis?", "options": {"A": "Acute tubular necrosis", "B": "Acute tubule-interstitial nephritis", "C": "Nephritic syndrome", "D": "Nephritic syndrome", "E": "Renal tubular acidosis"}, "answer": "B", "explanation": "The lecture lists NSAIDs, penicillins and PPIs as drug causes of acute interstitial nephritis. Fever, arthralgia and eosinophiluria are the hypersensitivity features, and the textbook describes the same picture. Acute tubular necrosis is the main wrong option because it does not usually cause fever, arthralgia or eosinophiluria (standard knowledge). Options C and D are printed identically as \"Nephritic syndrome\", and a nephritic picture would show haematuria and proteinuria, which the stem rules out.", "source": "5AKI lecture, Causes of intra-renal AKI (acute interstitial nephritis: penicillins, PPIs, NSAIDs). Kumar & Clark p. 1385, Box 36.27.", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 19, "batch": "26th Batch Q37", "bn": 26, "topic": "Causes of AKI from ATN", "type": "MTF", "lecture": "5", "stem": "Acute kidney injury secondary to acute tubular necrosis is/are caused by,", "options": {"A": "Snake venom", "B": "SLE", "C": "Paracetamol overdos", "D": "Ig A nephropathy", "E": "Intravascular hemorrhage"}, "answer": {"A": true, "B": false, "C": true, "D": false, "E": true}, "explanation": "The lecture lists snake bite envenomation under toxic ATN and haemorrhage under ischaemic ATN. SLE and IgA nephropathy injure the glomerulus (lupus nephritis, acute GN), and SLE can also cause interstitial nephritis, so neither is an ATN cause. Paracetamol overdose as an ATN cause is standard knowledge, not on the slides or in the textbook box. \"Overdos\" is a typo, and \"intravascular hemorrhage\" is odd wording, but blood loss leading to ischaemic ATN is the intended idea.", "source": "5AKI lecture, Causes of Intra-renal AKI (ischemic ATN: hemorrhage; toxic ATN: snake bite; AIN: SLE; acute GN: lupus nephritis). Kumar & Clark Box 36.34 (snake bite, haemorrhage).", "confidence": "CHECK on C. Neither the lecture nor Kumar & Clark's ATN box lists paracetamol overdose. Best answer is True.", "check": true, "checkLetters": ["C"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 20, "batch": "23rd Batch Q59", "bn": 23, "topic": "Interpreting an arterial blood gas", "type": "SBA", "lecture": "5", "stem": "The arterial blood gas report of an 18-year-old male admitted with vomiting and drowsiness shows pH 7.0, Pa CO2 24 mmHg and base deficit 15mmol/l.\nWhat is the most likely underlying diagnosis?", "options": {"A": "Gastric outlet obstruction", "B": "Heroin overdose", "C": "Diazepam overdose", "D": "Diabetic ketoacidosis", "E": "Isolated head injury"}, "answer": "D", "explanation": "A pH of 7.0 with a low PaCO2 and a base deficit of 15 is a severe metabolic acidosis with respiratory compensation (the lecture links acidosis to Kussmaul breathing). Vomiting and drowsiness in a young man fit diabetic ketoacidosis. Gastric outlet obstruction causes a metabolic alkalosis from acid loss. Heroin overdose, diazepam overdose and head injury cause hypoventilation, so PaCO2 would be raised, not low. The blood gas interpretation is standard knowledge, not on the AKI slides.", "source": "5AKI lecture, Clinical Presentation of AKI (acidosis: Kussmaul breathing) and Treatment of Life-Threatening Complications (severe metabolic acidosis). Acid-base interpretation: standard knowledge.", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 21, "batch": "31st Batch Q15", "bn": 31, "topic": "Indications for haemodialysis in AKI", "type": "MTF", "lecture": "5", "stem": "Indications for hemodialysis in a patient with acute kidney injury", "options": {"A": "Metabolic acidosis not responding to bicarbonate infusion", "B": "Serum potassium of 7.5 mmol/l", "C": "Pericarditis", "D": "Generalized tonic- clonic fits", "E": "Urine output 1ml/kg/h for 6 hours"}, "answer": {"A": true, "B": true, "C": true, "D": true, "E": false}, "explanation": "The lecture's absolute indications for urgent RRT are hyperkalaemia above 6.5 mmol/L (or ECG changes) unresponsive to medical therapy, pulmonary oedema unresponsive to diuretics, severe metabolic acidosis (pH <7.1), symptomatic uraemia (pericarditis, encephalopathy, bleeding) and drug poisoning. A potassium of 7.5, pericarditis and acidosis not corrected by bicarbonate (which can also worsen fluid overload) all fit, and fits are accepted as uraemic encephalopathy. A urine output of 1 mL/kg/h is above the KDIGO oliguria threshold of 0.5 mL/kg/h, so it is no indication. The lecture also advises against prophylactic KRT in asymptomatic patients.", "source": "5AKI lecture, Kidney replacement therapy: Absolute Indications for Urgent RRT, and Treatment of Life-Threatening Complications (hyperkalaemia, severe metabolic acidosis). Kumar & Clark p. 1391.", "confidence": "CHECK on B and D. For B, the lecture requires hyperkalaemia unresponsive to medical therapy, which the stem does not state. For D, the lecture names encephalopathy, not seizures, and a fit could have other causes. Best answer is B True, D True.", "check": true, "checkLetters": ["B", "D"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 22, "batch": "28th Batch Q38", "bn": 28, "topic": "Indications for haemodialysis following AKI", "type": "MTF", "lecture": "5", "stem": "What is the indications for haemodialysis following Acute Kidney injury?", "options": {"A": "Acidosis not responding to bicarbonate therapy", "B": "Hyperkalemia -7 mEq/L", "C": "Pericardial effusion", "D": "Urine output.0.5ml/kg/h for 2h", "E": "Serum albumin 3.2 g/l"}, "answer": {"A": true, "B": true, "C": true, "D": false, "E": false}, "explanation": "This is the same idea as Q21, so the answers are kept consistent. Acidosis resistant to bicarbonate and hyperkalaemia of 7 (mEq/L equals mmol/L for potassium) are indications. The lecture lists pericardial effusion as a complication of uraemia and pericarditis as an indication for RRT, and the textbook includes tamponade. A urine output of 0.5 mL/kg/h for 2 hours is not an indication, since the KDIGO oliguria criterion is for at least 6 hours and dialysis is not started for low urine output alone. Serum albumin has no role; \"g/l\" is likely a typo for g/dl, and either way it is not an indication.", "source": "5AKI lecture, Complications of AKI (uraemia: pericardial effusion), Absolute Indications for Urgent RRT and KRT Timing. Kumar & Clark p. 1391.", "confidence": "CHECK on C. The lecture lists pericardial effusion as a uraemic complication, but an effusion on its own, without uraemic pericarditis or tamponade, is not stated as an indication. Best answer is True.", "check": true, "checkLetters": ["C"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 23, "batch": "33rd Batch Q12", "bn": 33, "topic": "Progression of CKD", "type": "MTF", "lecture": "8", "stem": "Things happen in progression of ckd (MTF)", "options": {"A": "Atrophy of remaining tubules", "B": "Interstitial fibrosis", "C": "Tubular atrophy", "D": "Constriction of afferent artery than efferent", "E": "Hyaline nephrosclerosis"}, "answer": {"A": true, "B": true, "C": true, "D": false, "E": true}, "explanation": "The lecture lists the degree of interstitial scarring as a determinant of progression, and Kumar & Clark describe scarring in both glomeruli and interstitium. Remnant nephrons hyperfiltrate, with reduced arteriolar resistance, and angiotensin II constricts the efferent more than the afferent arteriole; D reverses this, so it is false. A and C describe the same event (tubular atrophy), so both are marked True. Hypertension drives progression, and hypertensive nephrosclerosis is a listed cause of CKD, but \"hyaline\" is not in the sources.", "source": "Lecture 8 Chronic Kidney Disease, \"Progression of CKD\" slide and \"Causes of CKD\" (hypertensive nephrosclerosis). Kumar & Clark Ch. 36, \"Progression\" (CKD section), p. 1393, and \"The renin-angiotensin system\", p. 1347.", "confidence": "CHECK on E. Hyaline arteriolosclerosis is standard knowledge; the sources list hypertensive nephrosclerosis as a cause, not as a step in progression. Best answer is E True.", "check": true, "checkLetters": ["E"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 24, "batch": "25th Batch Q29", "bn": 25, "topic": "Factors accelerating CKD progression", "type": "MTF", "lecture": "8", "stem": "Which of the following factors are known to accelerate the prognosis of chronic kidney disease ? (MTF)", "options": {"A": "ACE inhibitors", "B": "Hypertension", "C": "Nephritic medications", "D": "Proteinuria", "E": "Renovascular disease"}, "answer": {"A": false, "B": true, "C": true, "D": true, "E": true}, "explanation": "ACE inhibitors and ARBs are first-line renoprotection in the lecture, so they slow progression. Uncontrolled hypertension and proteinuria/albuminuria are on the lecture's list of factors associated with progression. Renovascular disease causes ischaemic nephropathy and progressive CKD (Kumar & Clark). \"Nephritic\" is almost certainly a typo for \"nephrotoxic\", and the lecture says to avoid nephrotoxins (NSAIDs, aminoglycosides, contrast), but it does not list them among the progression factors.", "source": "Lecture 8 Chronic Kidney Disease, \"Factors Associated with Progression\", \"2. Renoprotection Strategies\" and \"3. Avoid Nephrotoxins\" slides. Kumar & Clark Ch. 36, \"Renovascular disease\", p. 1371.", "confidence": "CHECK on C. The printed \"Nephritic medications\" is probably a typo for nephrotoxic. Best answer is C True.", "check": true, "checkLetters": ["C"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 25, "batch": "24th Batch Q35", "bn": 24, "topic": "CKD definition, BP target, protein restriction", "type": "MTF", "lecture": "8", "stem": "Which of the following statement regarding chronic kidney disease is/are true? (MTF)", "options": {"A": "Blood pressure should be reduced <160/100 mmHg to retard progression ofCKD", "B": "CKD is defined as a glomerular filtration rate of less than 60ml/min/1.73m2", "C": "Measurement of 24 hour creatinine clearance is accurate than estimated GFRcalculated by MDRD equation", "D": "Persistently increased proteinuria with normal or elevated GFR signifies stage1 CKD", "E": "Dietary protein restriction should be commenced at the stage 1 CKD"}, "answer": {"A": false, "B": true, "C": false, "D": true, "E": false}, "explanation": "The lecture gives a BP target of <130/80 mmHg (<120/80 in high cardiovascular risk), so <160/100 is far too high. Stage G1 is normal or high GFR with other evidence of kidney damage such as persistent albuminuria or proteinuria, so D is true. The lecture states that eGFR is generally more accurate than the measured 24-hour creatinine clearance, so C is false. Protein restriction (0.6-0.8 g/kg/day) is for advanced CKD only, so E is false. The printed \"ofCKD\", \"GFRcalculated\" and \"stage1\" are missing spaces.", "source": "Lecture 8 Chronic Kidney Disease, \"What is CKD?\", \"Classification of CKD (KDIGO)\", \"Estimating GFR\", \"2. Renoprotection Strategies\" and \"4. Dietary Management\" slides. Kumar & Clark Ch. 36, CKD \"Staging and prevalence\", p. 1393.", "confidence": "CHECK on B. The lecture defines CKD as kidney damage for 3 months or more, and GFR below 60 (G3a-G5) is only one way to meet that. The statement is incomplete rather than wrong. Best answer is B True.", "check": true, "checkLetters": ["B"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 26, "batch": "33rd Batch Q11", "bn": 33, "topic": "Complications of CKD", "type": "MTF", "lecture": "8", "stem": "Complications of ckd (MTF)", "options": {"A": "Anaemia", "B": "Hyperphosphatemia", "C": "Hypocalcemia", "D": "Metabolic alkalosis", "E": "Secondary hyperparathyroidism"}, "answer": {"A": true, "B": true, "C": true, "D": false, "E": true}, "explanation": "The lecture lists anaemia (mainly reduced erythropoietin) and CKD-mineral bone disorder, with hypocalcaemia, hyperphosphataemia, raised PTH and raised alkaline phosphatase. Falling phosphate excretion, reduced 1α-hydroxylase activity and low 1,25-(OH)2 vitamin D lead to secondary hyperparathyroidism. The acid-base disturbance in CKD is metabolic acidosis (the lecture targets bicarbonate above 22 mEq/L with sodium bicarbonate), not alkalosis, so D is false.", "source": "Lecture 8 Chronic Kidney Disease, \"(1) Anaemia\", \"Pathogenesis of CKD MBD\" and \"(4) Metabolic Complications\" slides.", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 27, "batch": "31st Batch Q8", "bn": 31, "topic": "CKD manifestations and pathophysiology", "type": "MTF", "lecture": "8", "stem": "What manifestations of CKD with pathophysiology are correctly matched (MTF)", "options": {"A": "Osteomalacia - Decreased action of 1-alpha hydroxylase", "B": "Anemia - Decreased erythropoietin", "C": "Polyuria- Inability of the kidney to concentrate urine", "D": "Convulsions- Due to increased uric acid levels", "E": "Acidosis- Due to increased CO2 levels in the blood"}, "answer": {"A": true, "B": true, "C": true, "D": false, "E": false}, "explanation": "Reduced renal 1α-hydroxylase lowers 1,25-(OH)2 vitamin D, and with hypocalcaemia this impairs osteoid mineralisation (osteomalacia). The lecture gives decreased erythropoietin production as the primary cause of the normochromic normocytic anaemia. Kumar & Clark attribute polyuria and nocturia to failing tubular concentrating ability. Seizures in CKD come from uraemia (lowered seizure threshold), not uric acid, and the acidosis is metabolic (low bicarbonate), not raised CO2 (the mechanism is standard knowledge).", "source": "Lecture 8 Chronic Kidney Disease, \"Pathogenesis of CKD MBD\", \"(1) Anaemia\", \"(4) Metabolic Complications\" and \"Nervous System Disease\" slides. Kumar & Clark Ch. 36, CKD clinical features (polyuria and nocturia; page not captured in the extract).", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null, "printedAlso": ["29th Batch Q35", "23rd Batch Q37"]}, {"id": 29, "batch": "27th Batch Q66", "bn": 27, "topic": "Confirming CKD in a hypertensive patient", "type": "SBA", "lecture": "8", "stem": "A 70 yrs old man who has hypertension for 15yrs presented with increased serum creatinine level. Best investigation finding to confirm that he has chronic kidney disease, (SBA)", "options": {"A": "Bilateral small contracted kidney in USS", "B": "Generalized oedema", "C": "Hyperkalemia", "D": "Reduce Hb level", "E": "Proteinuria"}, "answer": "A", "explanation": "The question is chronic versus acute. The lecture's AKI slide says to determine whether a raised creatinine is acute or chronic using renal ultrasound for kidney size and echogenicity, and Kumar & Clark say small, scarred, echogenic kidneys suggest a longstanding process. Anaemia (D) also suggests CKD but is non-specific. Oedema, hyperkalaemia and proteinuria occur in both acute and chronic disease, so they do not confirm chronicity.", "source": "Lecture 5 AKI, \"Investigation of AKI\" slide (acute or chronic, renal ultrasound). Kumar & Clark Ch. 36, \"Acute or chronic uraemia?\" (page not captured in the extract).", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "Kumar & Clark add that kidneys can stay normal in size in CKD from diabetes or amyloidosis, so normal-sized kidneys do not exclude CKD. This does not change the answer here. CHECK", "textbookOnly": false, "dupOf": null}, {"id": 30, "batch": "24th Batch Q34", "bn": 24, "topic": "Biochemical changes in CKD", "type": "MTF", "lecture": "8", "stem": "What are the biochemical changes which are expected in chronic kidney disease? (MTF)", "options": {"A": "Hyperkalaemia", "B": "Hypercalcaemia", "C": "Hypermagnesemia", "D": "Hyperphosphataemia", "E": "Hyperproteinaemia"}, "answer": {"A": true, "B": false, "C": true, "D": true, "E": false}, "explanation": "Hyperkalaemia and hyperphosphataemia are listed in the lecture (potassium-retaining drugs must be reviewed, phosphate excretion falls early). Kumar & Clark give the typical findings as hypocalcaemia, hyperphosphataemia, raised PTH and raised alkaline phosphatase, so hypercalcaemia (B) is false. Hypercalcaemia occurs only after long-standing tertiary hyperparathyroidism. Hypermagnesaemia reflects reduced renal magnesium excretion and is standard knowledge, as neither source covers it. Serum protein is not raised in CKD (it tends to fall with proteinuria and malnutrition; standard knowledge).", "source": "Lecture 8 Chronic Kidney Disease, \"Pathogenesis of CKD MBD\" and \"(4) Metabolic Complications\" slides. Kumar & Clark Ch. 36, \"Pathogenesis of CKD-MBD\", p. 1395.", "confidence": "CHECK on C. Neither the lecture nor the textbook mentions magnesium. Best answer is C True.", "check": true, "checkLetters": ["C"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 31, "batch": "24th Batch Q70", "bn": 24, "topic": "Factor most affecting CKD progression", "type": "SBA", "lecture": "8", "stem": "The factor which most affects the progression of disease in CKD? (SBA)", "options": {"A": "Atrophy of the tubules", "B": "Inflammation of the interstitium", "C": "Reduced production of erythropoietin", "D": "Scarring of the glomeruli", "E": "Systemic Hypertension"}, "answer": "E", "explanation": "The lecture says the speed of decline depends on the underlying nephropathy, blood pressure control, proteinuria and interstitial scarring, and lists uncontrolled hypertension first among factors associated with progression. Kumar & Clark also say the speed of decline depends on the underlying nephropathy and BP control. Hypertension is the main modifiable driver (raised intraglomerular pressure), and it is already marked True in Q24 B. Tubular atrophy, interstitial inflammation and glomerular scarring are structural results of injury, and reduced erythropoietin causes anaemia rather than driving progression.", "source": "Lecture 8 Chronic Kidney Disease, \"Progression of CKD\" and \"Factors Associated with Progression\" slides. Kumar & Clark Ch. 36, \"Progression\", p. 1393.", "confidence": "CHECK on A, B, D. The lecture itself names interstitial scarring as one determinant of progression, so the structural options cannot be ruled out entirely. Best answer is E.", "check": true, "checkLetters": ["A", "B", "D"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 33, "batch": "23rd Batch Q68", "bn": 23, "topic": "Feature supporting CKD in a hypertensive patient", "type": "SBA", "lecture": "8", "stem": "A 72-year-old man, who has been on treatment for hypertension for 15 years, has persistently elevated serum creatinine. What is the feature that best supports a diagnosis of chronic kidney disease in this patient? (SBA)", "options": {"A": "Anaemia", "B": "Hyperkalaemia", "C": "Metabolic acidosis", "D": "Hypocalcaemia", "E": "Hyperphosphataemia"}, "answer": "A", "explanation": "The lecture's AKI slide lists anaemia and bone disease as signs of CKD, and Kumar & Clark note that anaemia of chronic disease, hyperparathyroidism or renal osteodystrophy suggest CKD. The anaemia of CKD is normochromic normocytic, from reduced erythropoietin and building up over time, whereas hyperkalaemia, acidosis, hypocalcaemia and hyperphosphataemia also occur in AKI (standard knowledge). This item has no ultrasound option, unlike Q29, so anaemia is the best remaining marker of chronicity.", "source": "Lecture 5 AKI, \"Investigation of AKI\" slide (signs of CKD: anaemia, bone disease). Lecture 8 Chronic Kidney Disease, \"(1) Anaemia\" slide. Kumar & Clark Ch. 36, \"Acute or chronic uraemia?\" (page not captured in the extract).", "confidence": "CHECK on D, E. The lecture also lists bone disease as a sign of CKD, so a setter could intend a bone-mineral change. Best answer is A.", "check": true, "checkLetters": ["D", "E"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 34, "batch": "33rd Batch Q15", "bn": 33, "topic": "Drugs with long-term benefit in CKD", "type": "MTF", "lecture": "8", "stem": "The following medications have recognised long-term beneficial effects in patients with Chronic Kidney Disease (MTF)", "options": {"A": "Sodium bicarbonate", "B": "Calcium carbonate", "C": "Sitagliptin", "D": "Ramipril", "E": "Indapamide"}, "answer": {"A": true, "B": true, "C": false, "D": true, "E": false}, "explanation": "Sodium bicarbonate (about 1.8 g/day in the textbook trial) slows the decline in GFR in stage 4-5 CKD, and ACE inhibitors such as ramipril are first-line renoprotection, especially with albuminuria. Calcium carbonate is a listed phosphate binder and is also listed for acidosis, but the lecture warns against calcium overload. The lecture names SGLT2 inhibitors and GLP-1 receptor agonists, not DPP-4 inhibitors like sitagliptin, for renal or cardiovascular benefit. Indapamide appears only as a general \"diuretics\" option for BP control, with no specific CKD benefit stated.", "source": "Lecture 8 Chronic Kidney Disease, \"2. Renoprotection Strategies\", \"5. Correction of specific complications\" and \"Management of CKD MBD\" slides. Kumar & Clark Ch. 36, \"Management of CKD\", p. 1398 (bicarbonate), and \"Management of CKD-MBD\", p. 1395-1396 (phosphate binders).", "confidence": "CHECK on B, E. For B, the benefit is phosphate lowering and a surrogate effect, and Kumar & Clark say no mortality benefit is proven for binders; the lecture also cautions about calcium load. For E, there is no indapamide-specific CKD evidence in the lecture or textbook. Best answer is B True, E False.", "check": true, "checkLetters": ["B", "E"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 35, "batch": "30th Batch Q4", "bn": 30, "topic": "CKD complications and treatments", "type": "MTF", "lecture": "8", "stem": "Correctly matched complications of CKD and their treatments include, (MTF)", "options": {"A": "Anaemia - Erythropoietin", "B": "Hyperphosphatemia - Alendronate", "C": "Metabolic bone disease - 1 alpha cholecalciferol", "D": "Metabolic acidosis - Calcium resonium", "E": "Oedema - Furosemide"}, "answer": {"A": true, "B": false, "C": true, "D": false, "E": true}, "explanation": "The lecture treats anaemia with recombinant erythropoietin (epoetin-α or β, darbepoetin-α), given subcutaneously or intravenously with iron as needed. Metabolic bone disease is treated with vitamin D analogues (alfacalcidol, calcitriol), which is the 1-alpha-hydroxylated vitamin D in option C. Hyperphosphataemia is treated with dietary restriction and gut phosphate binders (sevelamer, lanthanum, calcium carbonate or acetate), not a bisphosphonate such as alendronate. Calcium resonium is an ion-exchange resin for hyperkalaemia, while acidosis is treated with sodium bicarbonate. The lecture does not name furosemide for CKD oedema, but loop diuretics are the standard choice (standard knowledge).", "source": "Lecture 8 Chronic Kidney Disease, \"Management of Anaemia\", \"Management of CKD MBD\" and \"5. Correction of specific complications\" slides. Kumar & Clark Ch. 36, \"Management of CKD-MBD\", pp. 1395-1396, and \"Correction of specific complications\", p. 1398.", "confidence": "CHECK on E. The lecture does not name furosemide for CKD oedema, so this is standard knowledge. Best answer is E True.", "check": true, "checkLetters": ["E"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 36, "batch": "29th Batch Q39", "bn": 29, "topic": "CKD drugs and their indications", "type": "MTF", "lecture": "8", "stem": "Which of the following are correctly matched with their indications in chronic kidney disease? (MTF)", "options": {"A": "1 cholecalciferol - Metabolic bone disease ⍺", "B": "Allopurinol - Hyperuricaemia", "C": "Irbesartan – Hyperkalemia", "D": "Losartan - Salt and water retention", "E": "Sulindac – Uremia"}, "answer": {"A": true, "B": true, "C": false, "D": false, "E": false}, "explanation": "The lecture lists alfacalcidol and calcitriol (vitamin D analogues) for CKD-MBD, and allopurinol at a reduced dose for gout prophylaxis from urate retention. Irbesartan and losartan are ARBs used for BP and albuminuria; they cause hyperkalaemia rather than treat it, and salt and water retention is treated with diuretics (standard knowledge). Sulindac is an NSAID (standard knowledge), which the lecture says to avoid in CKD as nephrotoxic. Typo: the ⍺ is misplaced in A; it is read as 1α-cholecalciferol (alfacalcidol).", "source": "8 Chronic Kidney Disease, Management of CKD-MBD (vitamin D therapy), Gout, Renoprotection and Avoid Nephrotoxins slides.", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 37, "batch": "26th Batch Q66", "bn": 26, "topic": "Anaemia of CKD treatment", "type": "SBA", "lecture": "8", "stem": "A 58 year old male with CKD presented with anemia. His hemoglobin level is 8.9g/dl. His blood picture shows normocytic normochromic anemia. What is the best treatment for his condition? (SBA)", "options": {"A": "Blood transfusion", "B": "IM vit B12 oral folate oral iron", "C": "IV iron", "D": "Oral iron", "E": "Subcutaneous erythropoietin"}, "answer": "E", "explanation": "CKD anaemia is normochromic and normocytic, and the primary cause is reduced erythropoietin production. The lecture treats it with recombinant ESAs (epoetin-α or β, darbepoetin-α) given subcutaneously or IV, with supplemental IV iron only as an adjunct. Blood transfusion should be avoided because HLA sensitisation is a barrier to transplantation. IV iron alone is wrong because no iron deficiency is described and iron alone does not replace the missing erythropoietin.", "source": "8 Chronic Kidney Disease, Anaemia and Management of Anaemia slides; Kumar & Clark p. 1394.", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 38, "batch": "23rd Batch Q66", "bn": 23, "topic": "Hyperkalaemia on ACEi plus ARB in CKD", "type": "SBA", "lecture": "8", "stem": "A 50-year-old woman has a 30 year history of systemic lupus erythematosus, complicated by lupus nephritis (currently inactive with a stable serum creatinine of 2.8-3.0 mg/dl). Her most recent serum potassium is 6.1mmol/l. She is currently treated with enalapril, losartan and frusemide. What is the most appropriate step in her immediate management? (SBA)", "options": {"A": "stopping enalapril and losartan", "B": "commencing dialysis", "C": "increasing dose of frusemide", "D": "advising a low-potassium diet", "E": "starting ion-exchange resin therapy"}, "answer": "A", "explanation": "The lecture's approach to CKD hyperkalaemia starts with restricting dietary potassium and stopping potassium-retaining drugs, and lists ion-exchange resins and dialysis later. She is on an ACE inhibitor plus an ARB, which together reduce potassium excretion, so removing the cause is the first step. Resin (E) treats the effect and dialysis (B) is for refractory or life-threatening cases. Combined ACEi plus ARB is not recommended (standard knowledge; the lecture is silent on it).", "source": "8 Chronic Kidney Disease, Correction of specific complications (Hyperkalemia) and Metabolic Complications slides; Kumar & Clark p. 1398.", "confidence": "CHECK on A. Lecture SBA 3 prefers continuing RAAS blockade at a reduced dose with a potassium binder, and the lecture does not address dual ACEi plus ARB, so the examiner may have intended E. Best answer is A.", "check": true, "checkLetters": ["A"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 39, "batch": "32nd Batch Q16", "bn": 32, "topic": "Drugs for hyperphosphataemia in CKD", "type": "MTF", "lecture": "8", "stem": "Medications used to treat hyperphosphatemia in chronic kidney disease include: (MTF)", "options": {"A": "Calcium carbonate", "B": "Calcium lactate", "C": "Cinacalcet", "D": "1-alpha calciferol", "E": "Sevelamer carbonate"}, "answer": {"A": true, "B": true, "C": false, "D": false, "E": true}, "explanation": "The lecture lists sevelamer carbonate, lanthanum carbonate, calcium carbonate and calcium acetate as gut phosphate binders taken with meals. Cinacalcet is a calcimimetic and 1-alpha calciferol (alfacalcidol) is a vitamin D analogue; both control PTH rather than lower phosphate. Calcium lactate is not named in the lecture or textbook; as a calcium salt it binds dietary phosphate (standard knowledge), so it is taken as True.", "source": "8 Chronic Kidney Disease, Management of CKD MBD slides (phosphate binders; PTH control); Kumar & Clark pp. 1395–1396.", "confidence": "CHECK on B. Calcium lactate is in neither the lecture nor the textbook binder lists, and the True call rests on standard knowledge. Best answer is True.", "check": true, "checkLetters": ["B"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 40, "batch": "30th Batch Q27", "bn": 30, "topic": "Analgesia in CKD with osteoporosis", "type": "SBA", "lecture": "8", "stem": "A 80-year-old woman has knee pain due to underlying osteoporosis. She has diabetic nephropathy with Serum Creatinine of 2.3 what is the most appropriate treatment for pain relief? (SBA)", "options": {"A": "Celecoxib", "B": "Paracetamol and codeine combination", "C": "Prednisolone", "D": "Pregabalin", "E": "Tramadol"}, "answer": "B", "explanation": "The lecture says to avoid NSAIDs in CKD, which rules out celecoxib (A). Prednisolone (C) is wrong because the lecture links corticosteroids to osteoporosis in CKD. Paracetamol-based analgesia is the safest of the options, but the lecture and textbook warn that opioids need dose adjustment because they can accumulate, so the codeine component needs a reduced dose. Pregabalin is renally cleared and is not a standard knee-pain drug (standard knowledge). The serum creatinine has no units printed.", "source": "8 Chronic Kidney Disease, Avoid Nephrotoxins and Osteoporosis (CKD-MBD) slides; Kumar & Clark p. 1398 (opioids accumulate) and p. 1380 (NSAIDs).", "confidence": "CHECK on B. The lecture does not name a preferred analgesic, and tramadol (E) is also a dose-adjusted opioid. Best answer is B.", "check": true, "checkLetters": ["B"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 41, "batch": "27th Batch Q38", "bn": 27, "topic": "CKD complications and their treatments", "type": "MTF", "lecture": "8", "stem": "Which of the following correctly match (MTF)", "options": {"A": "Anemia - Erythropoietin", "B": "Hyperkalemia - calcium resonium", "C": "Hypertension -ACE inhibitors", "D": "Hyperuricemia -Allopurinol", "E": "Metabolic bone disease - 1-£ ccf"}, "answer": {"A": true, "B": true, "C": true, "D": true, "E": true}, "explanation": "Anaemia is treated with recombinant erythropoietin (ESAs), and ACE inhibitors or ARBs are first-line for BP in CKD, especially with albuminuria. Hyperkalaemia is treated with ion-exchange resins such as calcium resonium, and allopurinol at a reduced dose prevents gout from urate retention. Vitamin D analogues (alfacalcidol, calcitriol) are used for CKD-MBD. Typo: \"1-£ ccf\" in E is read as 1-α cholecalciferol (alfacalcidol), which is consistent with Q36 A.", "source": "8 Chronic Kidney Disease, Management of Anaemia, CKD MBD, Gout and Renoprotection slides; 5 AKI, Treatment of Life-Threatening Complications slide (calcium resonium).", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 42, "batch": "27th Batch Q65", "bn": 27, "topic": "Diabetes drug choice in CKD", "type": "SBA", "lecture": "8", "stem": "A 60 year old patient having diabetes melitus with kidney disease was found to have serum creatinine level 2.8 mg/dL. His diabetic condition was well controlled with exercises and diet. Most recent investigations found HbA1C is 8.8% and BMI was 25 kg/m(2). What is the most appropriate treatment for this patient? (SBA)", "options": {"A": "Empagliflocin", "B": "Isophane insulin", "C": "Metformin", "D": "Pioglitazone", "E": "Tolbutamide"}, "answer": "A", "explanation": "The lecture says SGLT2 inhibitors (empagliflozin, dapagliflozin) slow progression of diabetic nephropathy, and Kumar & Clark adds that they also lower blood glucose. Metformin (C) is wrong because the lecture says to stop it when eGFR falls below 30; this creatinine in a 60-year-old man is roughly eGFR 25 (standard knowledge estimate). Insulin (B) is the main alternative, but the lecture says its dose must be reduced in advanced CKD. Pioglitazone and tolbutamide are poor choices in CKD because of fluid retention and hypoglycaemia (standard knowledge). Typos: \"Empagliflocin\", \"melitus\".", "source": "7 Systemic Disease affecting the Kidney, Management of Diabetic Nephropathy (Glycemic Control) slide; 8 Chronic Kidney Disease, Renoprotection Strategies slide; Kumar & Clark p. 1359.", "confidence": "CHECK on A. SGLT2 inhibitors lower glucose only weakly at eGFR near 25 (standard knowledge), and an HbA1c of 8.8% may need insulin, so the examiner may have intended B. Best answer is A.", "check": true, "checkLetters": ["A"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 43, "batch": "26th Batch Q35", "bn": 26, "topic": "Prescribing in CKD", "type": "MTF", "lecture": "8", "stem": "Regarding prescribing in patients with CKD, (MTF)", "options": {"A": "ACE Inhibitors are contraindicated in stage 3 CKD.", "B": "Loading dose must be reduced and maintenance dose should be kept unchanged.", "C": "Metformin is contraindicated in stage 4 CKD.", "D": "NSAIDs are contraindicated in CKD.", "E": "Thiazide diuretic is the drug of choice to treat oedema in CKD."}, "answer": {"A": false, "B": false, "C": true, "D": true, "E": false}, "explanation": "ACE inhibitors or ARBs are first-line renoprotection in CKD, so they are not contraindicated at stage 3. The textbook says the loading dose is unrelated to renal function, and the maintenance dose is given at longer intervals or in smaller doses, which reverses B. Stage 4 is eGFR 15–29, and the lecture says to stop metformin below eGFR 30. NSAIDs are listed under nephrotoxins to avoid. The lecture does not name thiazides, but it uses loop diuretics for oedema in nephrotic syndrome; loop diuretics are preferred over thiazides at low GFR (standard knowledge).", "source": "8 Chronic Kidney Disease, Renoprotection and Avoid Nephrotoxins slides; 7 Systemic Disease affecting the Kidney, Management of Diabetic Nephropathy slide (metformin); 3 Nephrotic Syndrome, General Management slide (loop diuretic); Kumar & Clark Box 36.24, p. 1380.", "confidence": "CHECK on D. The lecture wording is \"Contraindicated or use with caution\" for NSAIDs, so \"contraindicated\" is slightly stronger than the slide. Best answer is True.", "check": true, "checkLetters": ["D"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 44, "batch": "33rd Batch Q13", "bn": 33, "topic": "Haemodialysis", "type": "MTF", "lecture": "9", "stem": "Regarding Hemodialysis: (MTF)", "options": {"A": "Creation of an arteriovenous (AV) fistula is the preferred method of vascular access.", "B": "Maintenance hemodialysis is typically performed 3-4 times per week.", "C": "Dialysis disequilibrium syndrome is a recognized complication.", "D": "It is contraindicated in patients with heart failure.", "E": "It successfully filtrates large and medium-sized molecules."}, "answer": {"A": true, "B": true, "C": true, "D": false, "E": false}, "explanation": "The lecture calls the AVF the gold standard access, with the best long-term outcomes and lowest infection rate, and lists dialysis disequilibrium (over-rapid correction of uraemia causing cerebral oedema) as a complication. The lecture's standard schedule is 4-5 hours three times per week, so \"3-4 times per week\" is only loosely right, and it is the least certain option. Heart failure is not a contraindication (standard knowledge), because HD is used to remove fluid. HD works by diffusion, which clears small solutes well but middle molecules poorly (standard knowledge), which is why dialysis amyloidosis occurs. \"Filtrates\" is odd wording, since filtration is the haemofiltration mechanism.", "source": "09 Dialysis and renal transplant: Access for HD, AVF, Frequency & Duration of Dialysis, Dialysis Disequilibrium, Complications of Long-Term Dialysis; Kumar & Clark p. 1400 (frequency, disequilibrium, dialysis-related amyloidosis).", "confidence": "CHECK on B and E. B: the lecture and textbook give three times per week as standard, while the option says 3-4. E: the lecture is silent on molecule size, and high-flux membranes clear some middle molecules. Best answer is B True, E False.", "check": true, "checkLetters": ["B", "E"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 45, "batch": "32nd Batch Q12", "bn": 32, "topic": "Peritoneal dialysis", "type": "MTF", "lecture": "9", "stem": "Regarding peritoneal dialysis: (MTF)", "options": {"A": "Widely available in Sri Lanka", "B": "The entry point lies in the anterior abdominal wall", "C": "Can be complicated by peritonitis", "D": "Contraindicated in people with poor eyesight", "E": "Improves quality of life in end-stage renal disease (ESRD)"}, "answer": {"A": false, "B": true, "C": true, "D": false, "E": true}, "explanation": "The lecture says the Tenckhoff catheter goes through the anterior abdominal wall, and that PD peritonitis is the most common serious complication (cloudy effluent, >100 neutrophils/ml). Only severe visual impairment is a relative contraindication, so \"contraindicated in people with poor eyesight\" is too strong. The lecture says PD has limited availability in some regions and gives no Sri Lanka figures. It describes CAPD as giving patient independence and flexibility and prefers home-based therapies, which supports E.", "source": "09 Dialysis and renal transplant: Principles of PD, PD Peritonitis, Contra-indications to PD, CAPD, Choice of KRT (Access to Treatment); Kumar & Clark p. 1401.", "confidence": "CHECK on A, D and E. A: Sri Lanka availability is not in the lecture. D: \"poor eyesight\" versus \"severe visual impairment\" is a wording judgement. E: the lecture implies a quality-of-life benefit but never states it. Best answer is A False, D False, E True.", "check": true, "checkLetters": ["A", "D", "E"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 46, "batch": "26th Batch Q39", "bn": 26, "topic": "ESRD management", "type": "MTF", "lecture": "9", "stem": "In management of end stage renal disease, (MTF)", "options": {"A": "ACE inhibitors are absolutely contraindicated.", "B": "Amyloidosis is a long-term complication of hemodialysis.", "C": "Low protein diet is recommended.", "D": "NSAIDs should be avoided.", "E": "In peritoneal dialysis a catheter is placed in peritoneal cavity."}, "answer": {"A": false, "B": true, "C": true, "D": true, "E": true}, "explanation": "The lecture lists dialysis amyloidosis (carpal tunnel syndrome, arthropathy) as a long-term dialysis complication, and says the PD catheter is placed in the peritoneal cavity. ACE inhibitors are used for renoprotection in CKD and need monitoring for hyperkalaemia, so they are not absolutely contraindicated. NSAIDs are listed among the nephrotoxins to avoid in CKD. The CKD lecture says protein restriction (0.6-0.8 g/kg/day) may be beneficial in advanced CKD, but it also warns against malnutrition, and dialysis patients usually need more protein (standard knowledge).", "source": "09 Dialysis and renal transplant: Complications of Long-Term Dialysis, Principles of PD; 8 Chronic Kidney Disease: Dietary Management, Metabolic Complications (hyperkalaemia, medication review); Kumar & Clark p. 1394 (ACE inhibitors and ARBs slow progression) and the CKD drug-therapy section (NSAIDs listed as nephrotoxins, page not visible in the extract).", "confidence": "CHECK on A, C and D. A: the lecture does not say \"absolutely contraindicated\" for ESRD, and the answer rests on the renoprotection teaching plus standard knowledge. C: the lecture says \"may be beneficial\" in advanced CKD, and protein restriction is not advised once on dialysis. D: the lecture slides I could retrieve do not state it, and the support is the textbook plus standard knowledge. Best answer is A False, C True, D True.", "check": true, "checkLetters": ["A", "C", "D"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 47, "batch": "32nd Batch Q20", "bn": 32, "topic": "Nephrotic-range proteinuria with breast lump", "type": "SBA", "lecture": "3", "stem": "A 68-year-old woman presents with worsening periorbital and ankle edema for six months. She also has nephrotic-range proteinuria. Additionally, she is being investigated for a hard lump in her breast and is awaiting a biopsy. What is the most likely diagnosis?", "options": {"A": "Amyloidosis", "B": "Focal segmental glomerulosclerosis (FSGS)", "C": "Minimal change nephropathy", "D": "Membranous nephropathy", "E": "Systemic lupus erythematosus (SLE)"}, "answer": "D", "explanation": "Membranous glomerulopathy mainly affects adults (peak 50-60 years) and can be secondary to malignancy, with carcinoma of the breast named among the causes in the lecture. An older woman with nephrotic syndrome and a suspicious breast lump therefore fits membranous nephropathy. Amyloidosis is a listed secondary cause of nephrotic syndrome, but nothing in the stem points to it. Minimal change nephropathy is mainly a childhood disease, and FSGS is not linked to solid tumours in the lecture.", "source": "3 Nephrotic Syndrome, slides \"Causes of Secondary Membranous Glomerulopathy\" and \"Membranous glomerulopathy\"; Kumar & Clark p. 1357.", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 48, "batch": "32nd Batch Q22", "bn": 32, "topic": "IgA nephropathy, supporting test", "type": "SBA", "lecture": "4", "stem": "A 16-year-old girl presents with hematuria, oliguria, and periorbital edema. On examination, her blood pressure is 160/90 mmHg. She is suspected to have acute glomerulonephritis. Which of the following investigations best suggests IgA nephropathy in this patient? (SBA)", "options": {"A": "High circulating ANCA", "B": "High circulating IgG-containing immune complexes", "C": "High circulating polymeric IgA", "D": "High rheumatoid factor levels", "E": "Low C3 complement levels"}, "answer": "C", "explanation": "The lecture describes IgA nephropathy as mesangial deposits of polymeric IgA1, with about 50% of patients having an elevated serum IgA. So raised circulating polymeric IgA is the finding that points to it. Low C3 (E) is the pattern expected in post-infectious GN and lupus, not IgA nephropathy (standard knowledge for the normal C3 in IgA nephropathy). ANCA (A) belongs to pauci-immune vasculitis RPGN.", "source": "04Glomerulonephritis lecture, IgA Nephropathy slide (histology and 50% elevated serum IgA); Investigation of Glomerular Disease slide; Kumar & Clark p. 1362.", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 49, "batch": "31st Batch Q16", "bn": 31, "top
