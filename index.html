ic": "Acute nephritis, life-threatening complications", "type": "MTF", "lecture": "4", "stem": "A 36-year-old lady was admitted with gross hematuria, periorbital oedema, and vomiting. A few days back she got a throat infection. During investigations found to have\nUrine protein ++\nPus cells 20-30\nRed cells 100-200\nRed cell casts and granular casts\nThis patient can be life-threatening conditions, (MTF)", "options": {"A": "Hypertensive encephalopathy", "B": "Pulmonary oedema", "C": "Severe uremia", "D": "Generalized oedema", "E": "Convulsions"}, "answer": {"A": true, "B": true, "C": true, "D": false, "E": true}, "explanation": "This is acute nephritis (post-streptococcal picture). The lecture lists hypertension, oedema, and temporary oliguria and uraemia, and PSGN management is antihypertensives, diuretics, salt restriction and dialysis if necessary. The lecture does not name the life-threatening complications, so A, B, C and E are standard knowledge. Convulsions are the usual result of hypertensive encephalopathy or uraemia. Generalized oedema is a feature of the syndrome and not itself life-threatening. The stem has a grammar slip (\"This patient can be life-threatening conditions\").", "source": "04Glomerulonephritis lecture, Acute Nephritis slide and Management of PSGN slide; life-threatening complications are standard knowledge.", "confidence": "CHECK on D and E. The lecture and Kumar & Clark give no list of life-threatening complications, so the examiner's key for generalized oedema and convulsions is a judgement call. Best answer is A True, B True, C True, D False, E True.", "check": true, "checkLetters": ["D", "E"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 50, "batch": "29th Batch Q66", "bn": 29, "topic": "Recurrent painless haematuria after throat infection", "type": "SBA", "lecture": "4", "stem": "A 21-year-old woman present with painless hematuria and type 1 diabetic mellitus but it is getting better and she already has mild throat infection. Her platelet count and coagulation screen were normal and urine sample contain Red cells and proteins. What is the diagnosis? (SBA)", "options": {"A": "Diabetic mellitus", "B": "Immune thrombocytopenic purpura", "C": "IgA nephropathy", "D": "Minimal change disease", "E": "Urinary tract infection"}, "answer": "C", "explanation": "The lecture describes IgA nephropathy as affecting children and young adults, with macroscopic haematuria often following an upper respiratory infection, with or without proteinuria. Red cells plus protein in the urine with a throat infection and normal platelets and coagulation fits this. ITP (B) is excluded by the normal platelet count and coagulation screen. Minimal change disease (D) causes nephrotic syndrome rather than haematuria (standard knowledge). The stem has typos (\"present\", \"type 1 diabetic mellitus\") and the phrase \"it is getting better\" is unclear.", "source": "04Glomerulonephritis lecture, IgA Nephropathy – Clinical Features slide.", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 51, "batch": "27th Batch Q69", "bn": 27, "topic": "Asymptomatic microscopic haematuria", "type": "SBA", "lecture": "4", "stem": "A 22 years old man presented with asymptomatic microscopic haematuria and trace protein urea in urine analysis. His blood pressure and renal function were normal. In ultrasound scan bilateral kidneys were in normal size. What is most likely the diagnosis? (SBA)", "options": {"A": "Amyloidosis", "B": "Focal segmental glomerular sclerosis", "C": "IgA nephropathy", "D": "Membraneous nephropathy", "E": "Minimal change nephropathy"}, "answer": "C", "explanation": "The lecture lists asymptomatic microscopic haematuria, with or without proteinuria, as a presentation of IgA nephropathy in young males. Its summary slide names IgA nephropathy as the most common cause of asymptomatic urinary abnormalities. Normal blood pressure and renal function are the good-prognosis features it describes. Amyloidosis, FSGS, membranous nephropathy and minimal change disease present mainly with heavy proteinuria or nephrotic syndrome (standard knowledge, Kumar & Clark pp. 1353–1357). The stem has typos (\"protein urea\", \"Membraneous\").", "source": "04Glomerulonephritis lecture, IgA Nephropathy – Clinical Features and Prognosis slides; Summary slide.", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 52, "batch": "26th Batch Q64", "bn": 26, "topic": "Anti-GBM disease, confirmatory test", "type": "SBA", "lecture": "4", "stem": "Which of the following test is the best to confirm the diagnosis of anti-glomerular basement membrane disease (SBA)", "options": {"A": "Detection of Anti Neutrophil Cytoplasmic Antibodies (ANCA).", "B": "Measurement of serum IgA level.", "C": "Measurement of total serum IgG level.", "D": "Quantitative measurement of auto antibodies for type 4 collagen.", "E": "Quantitative measurement of C3 compliment."}, "answer": "D", "explanation": "The lecture lists anti-GBM antibodies among the serological tests for glomerular disease and describes linear IgG and C3 staining on the biopsy. Kumar & Clark states these antibodies are directed against the non-collagenous domain of the α3 chain of type IV collagen. So measuring antibodies to type 4 collagen is the confirmatory serology. ANCA (A) identifies the vasculitic RPGN group, not anti-GBM disease. Total IgG, IgA and C3 are not diagnostic. The options have typos (\"compliment\"), and biopsy immunofluorescence is not offered as an option.", "source": "04Glomerulonephritis lecture, Anti-GBM Glomerulonephritis slide and Investigation of Glomerular Disease slide; Kumar & Clark p. 1362 (target antigen).", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 53, "batch": "26th Batch Q67", "bn": 26, "topic": "Penicillamine-induced nephrotic syndrome", "type": "SBA", "lecture": "3", "stem": "22 years old male diagnosed with Wilsons disease presented with generalized body swelling. Diagnosis of nephrotic syndrome was made. His serum creatine was normal. He was on penicillamine for past 3 weeks. What is the most like etiology for his nephrotic syndrome?", "options": {"A": "Drug induced acute tubular necrosis.", "B": "Penicillamine causing membranous glomerulonephritis.", "C": "Penicillamine causing crescentic glomerulonephritis.", "D": "Penicillamine induce interstitial nephritis.", "E": "Wilsons disease give rise to renal tubule acidosis"}, "answer": "B", "explanation": "The lecture lists penicillamine, with gold and NSAIDs, as a drug cause of secondary membranous glomerulopathy, which presents as nephrotic syndrome. With a normal creatinine and an isolated nephrotic picture, ATN, crescentic GN and interstitial nephritis fit poorly. All three typically present with AKI or a rapidly progressive picture (standard knowledge, not in the lecture). The stem has typos (\"creatine\" for creatinine, \"most like\" for most likely, \"Wilsons\"), which do not change the answer.", "source": "3 Nephrotic Syndrome, slides \"Causes of Nephrotic Syndrome\" (drugs) and \"Causes of Secondary Membranous Glomerulopathy\"; Kumar & Clark p. 1357.", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 54, "batch": "24th Batch Q62", "bn": 24, "topic": "Haematuria 24 h after pharyngitis", "type": "SBA", "lecture": "4", "stem": "A 35 year old male presented with macroscopic hematuria 24 hours after onset of pharyngitis. His medical history other than that uneventful. On examination his BP was 160/90 mmHg. What is the most suitable diagnosis? (SBA)", "options": {"A": "Glomerulosclerosis", "B": "Henoch Schenloin purpura", "C": "IgA nephropathy", "D": "Post Streptococcal glomerulonephritis", "E": "Renal vein thrombosis"}, "answer": "C", "explanation": "The lecture describes IgA nephropathy as macroscopic haematuria that often follows an upper respiratory infection, and its SBA 1 explanation notes that the haematuria comes within days of the infection. PSGN has a latent interval of 1-3 weeks after the streptococcal infection, so haematuria at 24 hours points away from it (D), even though hypertension fits both. HSP (B) needs a purpuric rash and abdominal pain, which are not described. This is consistent with Q50 and Q91. The stem has a typo (\"Schenloin\").", "source": "04Glomerulonephritis lecture, IgA Nephropathy – Clinical Features slide; Post-Streptococcal Glomerulonephritis slide (1-3 weeks latent interval); SBA 1 explanation.", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 55, "batch": "30th Batch Q13", "bn": 30, "topic": "Indications for renal biopsy", "type": "MTF", "lecture": "4", "stem": "Renal biopsy indication (MTF)", "options": {"A": "Unexplained AKI", "B": "CKD in adults of small kidney", "C": "Adult onset nephrotic syndrome", "D": "Isolated haematuria with dysmorphic red blood cells.", "E": "RPGN in a solitary kidney"}, "answer": {"A": true, "B": false, "C": true, "D": false, "E": true}, "explanation": "The glomerulonephritis lecture only says \"renal biopsy (when indicated)\", so I used the other project lectures. The CKD lecture lists unexplained kidney failure with normal-sized kidneys and suspected RPGN as indications, and the Nephrotic Syndrome lecture lists adults with nephrotic syndrome. Small kidneys (B) are not an indication, because the lecture asks for normal-sized kidneys. Isolated haematuria with dysmorphic red cells (D) is not listed in either lecture, and treating it as not requiring biopsy is standard knowledge. A solitary kidney is a relative contraindication to percutaneous biopsy (standard knowledge), but the urgency of suspected RPGN is the lecture's indication.", "source": "8Chronic Kidney Disease lecture, Indications for Renal Biopsy slide; 3Nephrotic Syndrome lecture, Renal Biopsy slide; Kumar & Clark p. 1351 (biopsy in nephritic and nephrotic syndromes and acute and chronic kidney disease).", "confidence": "CHECK on D and E. No lecture addresses isolated haematuria or a solitary kidney directly, so both rest on standard knowledge. Best answer is D False and E True.", "check": true, "checkLetters": ["D", "E"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 56, "batch": "33rd Batch Q27", "bn": 33, "topic": "Diabetic nephropathy, add-on glycaemic drug", "type": "SBA", "lecture": "7", "stem": "A 60 year old with type 2 DM for 12 years presented with mocroalbuminurea. He is already on metformin and linagliptin. His most recent HbA1c level is 8%. What is the most benificial drug to be added to his drug regemen for glycemic control,", "options": {"A": "A long acting insulin", "B": "Acarbose", "C": "Dapagliflozin", "D": "Pioglytazone", "E": "Tolbutamide"}, "answer": "C", "explanation": "The lecture lists SGLT2 inhibitors (empagliflozin, dapagliflozin) as the glycaemic drugs that slow progression of diabetic nephropathy and preserve renal function. GLP-1 receptor agonists (liraglutide, semaglutide) are also renoprotective, but none is offered here. The other options (insulin, acarbose, pioglitazone, tolbutamide) are not named as renoprotective in the lecture, so they do not give the extra kidney benefit this patient needs. Typos in the stem: \"mocroalbuminurea\", \"benificial\", \"regemen\", \"Pioglytazone\".", "source": "Lecture 7 Systemic Disease affecting the Kidney, slide \"Management of Diabetic Nephropathy: Glycemic Control\"; Kumar & Clark p.1359 (agrees).", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 57, "batch": "31st Batch Q25", "bn": 31, "topic": "Microalbuminuria in type 2 DM, interpreting one ACR result", "type": "SBA", "lecture": "7", "stem": "A 59-year-old male patient with type 2 DM for the last 10 years has following investigation findings in his routine clinic visit\nUrine microalbumin / creatinine 100mgAlb/create g\nReference range\n0-29 Normal\n30-300 microalbuminuria\n>300 microalbuminuria\nWhich following statement describes the findings of the above investigation", "options": {"A": "Evidence of having chronic kidney disease.", "B": "Starting Losartan Potassium is beneficial for this patient.", "C": "His serum creatinine levels are expected to be high.", "D": "His Urine full report will show proteins (++)", "E": "This test is to be repeated to confirm the diagnosis."}, "answer": "E", "explanation": "The lecture says that when microalbuminuria is found, the test should be repeated twice within 3-6 months because false positives are common. A single result cannot be called CKD (A), since CKD needs kidney damage for 3 months or more, and ACE inhibitors or ARBs are advised for persistent microalbuminuria (B). C is wrong because plasma creatinine stays normal until proteinuria becomes persistent. D is wrong because microalbuminuria is too small for dipstick (UFR) detection. In the printed ranges the last band should read \"macroalbuminuria\", and \"create g\" is a typo.", "source": "Lecture 7, slides \"Screening for diabetic nephropathy\" and \"Clinical Progression and Albuminuria\"; Lecture 8 Chronic Kidney Disease, slides \"What is CKD?\" and \"Classification of CKD (KDIGO)\".", "confidence": "CHECK on B. Losartan is also supported by the lecture for persistent microalbuminuria, but this is a single unconfirmed result and the lecture asks for repeat testing first. Best answer is E.", "check": true, "checkLetters": ["B"], "textbookDiffers": "Kumar & Clark p.1349 equates an ACR of 2.5-20 mg/mmol with 30-300 mg/day albuminuria, whereas the lecture gives microalbuminuria as ACR 3-30 mg/mmol. The question uses mg/g, so the answer is unchanged. CHECK", "textbookOnly": false, "dupOf": null}, {"id": 58, "batch": "30th Batch Q28", "bn": 30, "topic": "Microalbuminuria in DM, best statement for ACR 240 mg/g", "type": "SBA", "lecture": "7", "stem": "A 50-year-old man, with a 10-year history of DM, presented with a urine microalbumin report\nUrine microalbumin/creatinine ratio=240mg Alb/ g creatinine\nCreatinine Reference ranges\n• 0-29mg- Normal\n• 30-300- Microalbuminuria\n• >300- Macroalbuminuria", "options": {"A": "UFR will show 1+ protein", "B": "Need to do a fasting repeat for better diagnosis", "C": "Kidney damage in this patient is irreversible", "D": "Shows features of CKD", "E": "Benefits from losartan K"}, "answer": "E", "explanation": "The lecture says ACE inhibitors or ARBs (such as losartan) are first line in diabetic nephropathy and should be considered even in normotensive patients with persistent microalbuminuria. A is wrong because microalbuminuria is too small for dipstick detection. B is wrong because the lecture asks for a first-morning midstream ACR repeated twice in 3-6 months, and fasting is not mentioned (fasting not needed is standard knowledge). C is not supported, because the lecture only says progression can be slowed, and D needs persistence over 3 months. The same idea as Q57: the result needs confirming, but the repeat here is worded as \"fasting\", so E is the only fully correct option. \"losartan K\" is a typo for losartan potassium.", "source": "Lecture 7, slides \"Management of Diabetic Nephropathy: Blood Pressure Control\", \"Screening for diabetic nephropathy\" and \"Clinical Progression and Albuminuria\"; Lecture 8, slides \"What is CKD?\" and \"Classification of CKD (KDIGO)\"; Kumar & Clark p.1359.", "confidence": "CHECK on D. Lecture 8 counts persistent albuminuria as evidence of CKD, but one ACR result does not show persistence. Best answer is E.", "check": true, "checkLetters": ["D"], "textbookDiffers": "Kumar & Clark p.1349 gives the ACR band for 30-300 mg/day albuminuria as 2.5-20 mg/mmol, against the lecture's 3-30 mg/mmol. The answer is unchanged. CHECK", "textbookOnly": false, "dupOf": null}, {"id": 59, "batch": "28th Batch Q39", "bn": 28, "topic": "Early detection of diabetic renal disease", "type": "MTF", "lecture": "7", "stem": "A 45-year-old male was diagnosed with type II diabetes mellitus. Since his uncle has got kidney failure due to poor control of diabetes, he inquires about the early diagnostic measures of renal failure due to diabetes. What are the investigations that can be used to? detect renal failure early?", "options": {"A": "A.UFR", "B": "Serum microalbumin", "C": "Serum creatinine", "D": "Serum electrolytes", "E": "Random blood sugar"}, "answer": {"A": false, "B": false, "C": false, "D": false, "E": false}, "explanation": "The lecture's screening test is the albumin:creatinine ratio (ACR) in a first-morning midstream urine sample, and microalbuminuria is too small for dipstick (UFR) detection. B is a urine test, not a serum test, so \"Serum microalbumin\" as printed is false. Plasma creatinine stays normal until proteinuria becomes persistent, so it is a late marker, and electrolytes and blood sugar do not detect diabetic kidney disease. Typos in the stem: \"A.UFR\" and \"used to? detect\".", "source": "Lecture 7, slides \"Screening for diabetic nephropathy\" and \"Clinical Progression and Albuminuria\"; Kumar & Clark p.1349 (ACR is the preferred screening test for diabetic kidney disease).", "confidence": "CHECK on B. Examiners probably meant urine microalbumin, which would be True. As printed (\"Serum\"), the best answer is B False.", "check": true, "checkLetters": ["B"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 60, "batch": "26th Batch Q31", "bn": 26, "topic": "Renal conditions secondary to diabetes mellitus", "type": "MTF", "lecture": "7", "stem": "Which of the following conditions can be secondary to diabetes mellitus?", "options": {"A": "Acute papillary necrosis", "B": "IgA Nephropathy", "C": "Rapid progressive glomerular nephritis", "D": "Multiple cysts in the cortex", "E": "Acute pyelonephritis"}, "answer": {"A": true, "B": false, "C": false, "D": false, "E": true}, "explanation": "Lecture 7 covers only diabetic glomerulopathy (diffuse and nodular glomerulosclerosis, Kimmelstiel-Wilson lesion) and is silent on A and E. Kumar & Clark links papillary necrosis to diabetes and lists diabetes as a risk factor for UTI, and Lecture 2 names diabetes as a cause of complicated UTI. IgA nephropathy and RPGN are primary glomerular diseases, and diabetes does not cause cortical cysts (standard knowledge).", "source": "Lecture 7, slide \"DKD - Pathophysiology\"; Lecture 2 UTI in adults, slide \"Terminology in UTI\"; Kumar & Clark p.1386 (papillary necrosis in diabetes) and p.1382 (diabetes as UTI risk factor).", "confidence": "CHECK on A. Kumar & Clark describes papillary necrosis in diabetes under chronic tubulointerstitial nephritis, while the option says \"acute\". Best answer is True.", "check": true, "checkLetters": ["A"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 61, "batch": "26th Batch Q61", "bn": 26, "topic": "Macroalbuminuria in DM, best statement", "type": "SBA", "lecture": "7", "stem": "A 56-year-old man with a history of DM for 10 years presents with the following urine microalbumin report.\nUrine microalbumin 350mg albumin/g creatinine\nRR\nNormal 0-29\nmicroalbuminuria 30-300\nMacroalbuminuria >300\nWhat is the most correct statement?", "options": {"A": "Need a fasting repeat sample for correct diagnosis.", "B": "The kidney damage is reversible in this patient.", "C": "The patient has chronic kidney disease.", "D": "The patient will benefit commencing enalapril therapy.", "E": "UFR will show proteinuria + + +"}, "answer": "D", "explanation": "The lecture gives ACE inhibitors and ARBs as first-line treatment in diabetic nephropathy, and Kumar & Clark advises them once microalbuminuria develops, so enalapril is clearly beneficial at the macroalbuminuria stage. A is wrong because the lecture specifies a first-morning midstream sample, with no fasting. B is not supported, since the lecture only says progression can be slowed. C is true only if the albuminuria persists for 3 months or more, and this is a single result. The lecture does not say the dipstick must read +++ at this level, so E is unreliable. This is consistent with Q58, where the ACE inhibitor/ARB option was chosen for the same reason.", "source": "Lecture 7 Systemic Disease affecting the Kidney, slides \"Management of Diabetic Nephropathy: Blood Pressure Control\" and \"Clinical Progression and Albuminuria\"; Lecture 8 Chronic Kidney Disease, slides \"What is CKD?\" and \"Classification of CKD (KDIGO)\"; Kumar & Clark p.1359.", "confidence": "CHECK on C. Lecture 8 counts persistent albuminuria (ACR above 30 mg/g) as CKD evidence, so C is arguably true in a diabetic patient, but one result does not show persistence. Best answer is D.", "check": true, "checkLetters": ["C"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 62, "batch": "25th Batch Q36", "bn": 25, "topic": "Factors retarding diabetic nephropathy progression", "type": "MTF", "lecture": "7", "stem": "Which of the following is/are known to retard the progression of diabetic nephropathy ?", "options": {"A": "Aspirin.", "B": "Erythropoietin.", "C": "Good blood pressure control.", "D": "Good glycaemic control.", "E": "Statins."}, "answer": {"A": false, "B": false, "C": true, "D": true, "E": true}, "explanation": "The lecture lists tight glycaemic control (HbA1c below 7%) and blood pressure control with ACE inhibitors or ARBs (target below 130/80 mmHg) as the core measures. It also lists statins under cardiovascular risk management, and Kumar & Clark includes control of dyslipidaemia among the measures to prevent progression. Aspirin is not mentioned in the lecture or textbook for this purpose (standard knowledge: it is used for cardiovascular protection, not renoprotection). Erythropoietin treats the anaemia of CKD and does not slow GFR decline (standard knowledge).", "source": "Lecture 7, slides \"Management of Diabetic Nephropathy\" (Glycemic Control, Blood Pressure Control, Cardiovascular Risk Management, Renoprotection Strategies); Kumar & Clark p.1359.", "confidence": "CHECK on B. The lecture's \"Renoprotection Strategies\" slide lists anaemia management with iron ± ESA, which could make B look True, but this treats the complication and does not slow progression. Best answer is B False. Also CHECK on A and E: the lecture and textbook are silent on aspirin (False), and the lecture places statins under cardiovascular risk (True).", "check": true, "checkLetters": ["A", "B", "E"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 63, "batch": "25th Batch Q39", "bn": 25, "topic": "Microalbuminuria statements", "type": "MTF", "lecture": "7", "stem": "Which of the following statement/s is/are true or false regarding micro albuminuria ?", "options": {"A": "Assessment should be avoided if the patient is having a febrile illness.", "B": "It is a marker of iincreased risk for cardiovascular disease.", "C": "It is ass8ing used urine full report.", "D": "It is known to remit to normoalbuminuria with treatment.", "E": "It should be measured in urine even if urine protein is(++)"}, "answer": {"A": true, "B": true, "C": false, "D": true, "E": false}, "explanation": "Kumar & Clark says pyrexia, exercise and upright posture raise urinary protein without meaning disease, and the lecture says false positives are common, so testing during a febrile illness should be avoided (A). The lecture says diabetic nephropathy significantly increases cardiovascular risk, and Kumar & Clark says ACR independently predicts cardiovascular mortality (B). C is garbled (probably \"assessed using urine full report\") and false, because microalbuminuria is too small for dipstick detection. D is standard knowledge (it can regress with treatment), and E is standard knowledge (a ++ dipstick already shows overt proteinuria, so microalbumin testing adds nothing). Typos: \"iincreased\", \"ass8ing\", \"is(++)\".", "source": "Lecture 7, slides \"Clinical Progression and Albuminuria\", \"Screening for diabetic nephropathy\" and \"DKD - Epidemiology\"; Kumar & Clark p.1349.", "confidence": "CHECK on C, D and E. C is garbled in print. D and E rest on standard knowledge, since neither the lecture nor the textbook says it directly. Best answers are C False, D True, E False.", "check": true, "checkLetters": ["C", "D", "E"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 64, "batch": "24th Batch Q63", "bn": 24, "topic": "Earliest biochemical marker of diabetic nephropathy", "type": "SBA", "lecture": "7", "stem": "Which of the following is the earliest biochemical marker of Diabeticnephropathy?", "options": {"A": "Raised blood urea", "B": "Microalbuminuria", "C": "Proteinuria", "D": "Rise in serum creatinine", "E": "Increased serum uric acid"}, "answer": "B", "explanation": "The lecture describes gradually rising urinary albumin excretion, starting as microalbuminuria and progressing to persistent proteinuria and then macroalbuminuria. It states that plasma creatinine stays normal until proteinuria becomes persistent, so urea and creatinine are late markers. Annual ACR screening for microalbuminuria is the recommended way to detect diabetic nephropathy early. Hyperfiltration comes earlier but is a functional change, not a biochemical marker.", "source": "Lecture 7, slides \"Clinical Progression and Albuminuria\", \"Stages of Diabetic Nephropathy\" and \"Screening for diabetic nephropathy\"; Kumar & Clark p.1349.", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 65, "batch": "30th Batch Q22", "bn": 30, "topic": "Young woman with arthritis, rash and proteinuria, diagnosis", "type": "SBA", "lecture": "7", "stem": "A 17 old female presented to the ward with periorbital edema and bilateral lower limb swelling. She is having small joints and large joints arthritis, mouth ulcers, and photosensitive rash. The blood pressure on admission was 130/80 and proteinuria is found in the urine. Investigations revealed an ESR – 80mm/hr. A renal pathology is suspected. What is the most correct diagnosis?", "options": {"A": "Renal amyloidosis", "B": "Good pasture syndrome", "C": "Scleroderma", "D": "SLE", "E": "Henoch-Schönlein purpura"}, "answer": "D", "explanation": "The lecture describes SLE as an autoimmune multisystem disease with a female predominance of 9:1, and lupus nephritis can present with proteinuria, nephrotic syndrome or oedema. Arthritis, mouth ulcers, photosensitive rash and a very high ESR are classic SLE features (standard knowledge; the lecture does not list them). HSP (E) fits a young child with purpura, abdominal colic and a male predominance of 2:1. Scleroderma (C) presents with accelerated hypertension and renal crisis, and amyloidosis (A) with large kidneys and no rash or ulcers. Typos: \"A 17 old female\", \"Good pasture\".", "source": "Lecture 7, slides \"Systemic Lupus Erythematosus (SLE) and Lupus Nephritis\", \"Clinical Presentations of Lupus Nephritis\", \"Immunoglobulin A Vasculitis (Henoch-Schönlein Syndrome)\", \"Systemic Sclerosis\" and \"Diagnosis of Amyloidosis\".", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 66, "batch": "25th Batch Q67", "bn": 25, "topic": "SLE with renal biopsy findings", "type": "SBA", "lecture": "7", "stem": "A 28-year-old woman complain of joint pain, fever, a reddish rash on her face and fatigue for one month. She has marked pheriperal oedema and is hypertensive. Investigations reveal elevated serum creatinine, low serum albumin and protein uria of 2+. A renal biopsy reveals focal segmental glomerulonephritis with subendothelial and mesengial immune deposits. What is the most likely diagnosis?", "options": {"A": "Focal segmental glomerulosclerosis", "B": "IgA nephropathy", "C": "Lupus nephritis", "D": "Membranous glomerulonephritis", "E": "Post-streptococcal glomerulonephritis"}, "answer": "C", "explanation": "The lecture describes lupus nephritis as immune-complex glomerulonephritis, with focal lupus nephritis (Class III) defined as involving less than 50% of glomeruli. A young woman with joint pain, fever, facial rash, hypertension, raised creatinine and low albumin fits (the rash and arthritis are standard knowledge, as the lecture does not list them). IgA nephropathy (B) has mesangial IgA deposits only, not subendothelial deposits, and has no systemic features like these. FSGS (A) is a sclerosing lesion without immune deposits. Typos: \"complain\", \"pheriperal\", \"protein uria\", \"mesengial\".", "source": "Lecture 7 Systemic Disease affecting the Kidney, slides \"Systemic Lupus Erythematosus (SLE) and Lupus Nephritis\" and \"ISN/RPS Classification of Lupus Nephritis\"; Lecture 4 Glomerulonephritis, slide \"IgA Nephropathy\".", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 67, "batch": "31st Batch Q7", "bn": 31, "topic": "Systemic diseases causing nephrotic syndrome", "type": "MTF", "lecture": "7", "stem": "Which of these systemic diseases can give rise to nephrotic syndrome?", "options": {"A": "Amyloidosis", "B": "Good pastures syndrome", "C": "SLE", "D": "IgA nephropathy", "E": "Bacterial endocarditis"}, "answer": {"A": true, "B": false, "C": true, "D": false, "E": false}, "explanation": "Lecture 7 names amyloidosis as a systemic cause of nephrotic syndrome (the most common renal presentation of AL amyloidosis). It lists SLE under mixed nephrotic/nephritic disease, and Lecture 3 lists SLE and amyloidosis as secondary causes. Goodpasture's (anti-GBM) disease causes rapidly progressive nephritic disease. In infective endocarditis the lecture describes a focal and segmental GN resembling post-infectious GN (nephritic), and it is not in Lecture 3's list of nephrotic causes. IgA nephropathy is a primary glomerular disease, not a systemic one, and it is not in Lecture 3's list of primary nephrotic causes. Typos: \"Good pastures syndrome\".", "source": "Lecture 7, slides \"Systemic Diseases causing Glomerular Disease\" and \"AL Amyloidosis\"; Lecture 3 Nephrotic Syndrome, slide \"Causes of Nephrotic Syndrome\"; Lecture 4, slides \"Other Acute GN Causes: Infective Endocarditis\" and \"IgA Nephropathy\"; Kumar & Clark p.1361.", "confidence": "CHECK on D and E. The lectures do not say outright that these never cause nephrotic syndrome, and Lecture 7 notes that IgA vasculitis (HSP), a related disease, can rarely present with nephrotic syndrome. Best answers are D False and E False.", "check": true, "checkLetters": ["D", "E"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 68, "batch": "29th Batch Q32", "bn": 29, "topic": "Systemic diseases presenting with nephrotic syndrome", "type": "MTF", "lecture": "7", "stem": "Which of the following systemic diseases are known to present with nephrotic syndrome?", "options": {"A": "Amyloidosis", "B": "Diabetic mellitus", "C": "Wegener’s granulomatosis", "D": "Systemic lupus erythematosus", "E": "Systemic sclerosis"}, "answer": {"A": true, "B": true, "C": false, "D": true, "E": false}, "explanation": "Amyloidosis, diabetic nephropathy and SLE are the nephrotic causes in Lectures 3 and 7, matching the answers in Q67. Wegener's granulomatosis (now GPA) is an ANCA vasculitis whose renal lesion is crescentic GN causing AKI, which is the nephritic/RPGN picture. In systemic sclerosis the renal event is scleroderma renal crisis, with accelerated hypertension, rapidly progressive kidney failure and proteinuria, so it is not a nephrotic cause. Typos: \"Diabetic mellitus\".", "source": "Lecture 7, slides \"Systemic Diseases causing Glomerular Disease\", \"Systemic Sclerosis (Scleroderma)\" and \"Diabetic Nephropathy: Clinical Progression\"; Lecture 3, slide \"Causes of Nephrotic Syndrome\"; Lecture 4, slide \"ANCA-positive Vasculitis\".", "confidence": "CHECK on E. The lecture lists proteinuria in scleroderma renal crisis but does not describe it as nephrotic. Best answer is E False.", "check": true, "checkLetters": ["E"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 69, "batch": "33rd Batch Q25", "bn": 33, "topic": "Renal artery stenosis, confirmatory investigation", "type": "SBA", "lecture": "6", "stem": "58 year old man with treatment resistant hypertension on three antihypertensive agents presents with recurrent episodes of acute pulmonary edema despite of normal left ventricular function on echocardiogram. He has a history of smoking and peripheral vascular disease. On examination an epigastric bruit is heard. Which of the following investigation would be most useful to confirm diagnosis ?", "options": {"A": "24 hour ambulatory blood pressure monitoring", "B": "Dimercaptosuccinic acid scan (DMSA scan)", "C": "Serum renin and aldosterone levels", "D": "Renal artery Doppler ultrasound", "E": "Renal biopsy"}, "answer": "D", "explanation": "This is atherosclerotic renal artery stenosis: resistant hypertension, recurrent flash pulmonary oedema, smoking, peripheral vascular disease and an abdominal bruit. The lecture names renal duplex ultrasound as the best initial non-invasive test (peak systolic velocity >200 cm/s suggests significant stenosis). Angiography is the gold standard but is not offered, so D is the best option. Plasma renin (C) is often raised but is not diagnostic. Wording note: \"edema\" is printed in the American spelling.", "source": "Renovascular Disease lecture, slides \"Clinical Presentations of RAS\", \"Physical Examination\" and \"Investigations\". Kumar & Clark, ch. 36, p. 1372 (screening for renovascular disease).", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 70, "batch": "31st Batch Q14", "bn": 31, "topic": "Renal artery stenosis, supportive findings", "type": "MTF", "lecture": "6", "stem": "Which of the following investigation findings supports the diagnosis of renal artery stenosis?", "options": {"A": "Unilateral small kidney in USS scan", "B": "Increase serum creatinine in a hypertensive patient", "C": "Low serum potassium in a hypertensive patient", "D": "Total and differential renal function worsening with Captopril in Captopril DTPA scan", "E": "Increase in plasma renin"}, "answer": {"A": true, "B": true, "C": true, "D": true, "E": true}, "explanation": "The lecture lists unequal or small kidneys on ultrasound (asymmetry >1.5 cm), unprovoked hypokalaemia (K+ <3.6 mEq/L) and captopril-enhanced DTPA/MAG3 renography with worsening function as supporting RAS. Plasma renin activity is \"often elevated (but not diagnostic)\", so E supports but does not prove it. B is the weakest: the lecture names CKD and a creatinine rise on ACE inhibitor as presentations, but it does not list a bare creatinine rise as a diagnostic finding. Wording note: \"Increase serum creatinine\" is missing \"in\".", "source": "Renovascular Disease lecture, slides \"Past Medical History\", \"Investigations\" and \"DTPA Scan with Captopril\".", "confidence": "CHECK on B. The lecture lists CKD or a creatinine rise on ACE inhibitor as a presentation, not a raised creatinine alone in a hypertensive patient. Best answer is True.", "check": true, "checkLetters": ["B"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 71, "batch": "29th Batch Q36", "bn": 29, "topic": "Renal artery stenosis, general features", "type": "MTF", "lecture": "6", "stem": "Regarding renal artery stenosis,", "options": {"A": "It causes essential hypertension", "B": "It causes the worsening of renal function with ACE inhibitors", "C": "Atherosclerosis is majorly associated in 60-year-old patients", "D": "Should be suspected in uncontrolled hypertension even with multiple antihypertensive drugs", "E": "Can cause flash pulmonary oedema"}, "answer": {"A": false, "B": true, "C": true, "D": true, "E": true}, "explanation": "RAS is a cause of secondary hypertension, not essential hypertension, so A is false. The lecture lists worsening renal function or AKI with ACE inhibitors/ARBs and flash pulmonary oedema as presentations. Atherosclerosis causes 70-80% of cases, typically in patients >50 years. Severe or resistant hypertension despite multi-drug therapy is a red flag. This is consistent with Q69, where the same features pointed to atherosclerotic RAS.", "source": "Renovascular Disease lecture, slides \"Definition\", \"Causes\", \"Atherosclerotic Disease\", \"Clinical Presentations of RAS\" and \"History - Red Flags for RAS\".", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 72, "batch": "27th Batch Q31", "bn": 27, "topic": "Renal artery stenosis, causes and features", "type": "MTF", "lecture": "6", "stem": "Regarding renal artery stenosis,", "options": {"A": "Fibromuscular dysplasia of the vessel is a known cause", "B": "It is a cause for secondary hypertension", "C": "It is a cause for Chronic Kidney Disease", "D": "Presents with severe loin pain", "E": "Use of ACEI in treatment leads to worsening of renal function"}, "answer": {"A": true, "B": true, "C": true, "D": false, "E": true}, "explanation": "FMD is the second main cause (15-20%), mainly in women <40 years, and RAS is a major cause of secondary hypertension. CKD and worsening renal function with ACE inhibitors/ARBs are listed presentations. Severe loin pain is not among the lecture's presentations of RAS, so D is false. Loin pain suggests renal infarction or artery occlusion, which is standard knowledge here and also appears in Kumar & Clark's renal artery occlusion section. Wording note: the stem uses \"ACEI\" for ACE inhibitor.", "source": "Renovascular Disease lecture, slides \"Causes\", \"Fibromuscular Dysplasia (FMD)\" and \"Clinical Presentations of RAS\". Kumar & Clark, ch. 36, \"Other vascular disorders of the kidney\" (renal artery occlusion).", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 73, "batch": "24th Batch Q32", "bn": 24, "topic": "Renovascular hypertension, clinical clues", "type": "MTF", "lecture": "6", "stem": "Which of the following suggest renovascularhypertension?", "options": {"A": "Onset of hypertension before 30 years without risk factors", "B": "Hyperkalaemia with administration of ACEI for hypertension", "C": "Persistant hypertension despite appropriate multi drug anti- hypertensive therapy", "D": "Severe hypertension in patient with CKD", "E": "Sudden increase of blood pressure in patient with previously well controlled hypertension"}, "answer": {"A": true, "B": false, "C": true, "D": true, "E": true}, "explanation": "A, C and E are red flags listed in the lecture. For B, the lecture's clue is a sustained creatinine rise >30% with ACE inhibition, and its low potassium clue is unprovoked hypokalaemia, not hyperkalaemia. The lecture lists progressive hyperkalaemia only as a contraindication to ACE inhibitor therapy. D is accepted because the lecture lists CKD as a presentation and moderate-to-severe hypertension with unexplained atrophic kidneys as a clue. Wording notes: \"renovascularhypertension\" is missing a space and \"Persistant\" is misspelt.", "source": "Renovascular Disease lecture, slides \"History - Red Flags for RAS\", \"Past Medical History\" and \"Chronic Medical Management\".", "confidence": "CHECK on B. Hyperkalaemia with an ACE inhibitor is non-specific (standard knowledge), and the examiner may have meant the creatinine rise. Best answer is False. CHECK on D. The lecture's clue needs unexplained atrophic kidneys, which the option does not state. Best answer is True.", "check": true, "checkLetters": ["B", "D"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 74, "batch": "25th Batch Q66", "bn": 25, "topic": "ADPKD presentation", "type": "SBA", "lecture": "T", "stem": "A 35-year-old man complains of dull pain in the loin for eight months, which has become worse over the past week. He has also noticed reddish urine. He says that his father and grandfather both died suddenly from a \"bleed in the brain\". He is found to be hypertensive and investigations reveal elevated serum creatinine. What is the most likely diagnosis, (SBA)", "options": {"A": "Haemophelia A", "B": "Medullary sponge kidney", "C": "Polycystic kidney disease", "D": "Renal stone disease", "E": "Urinary tract infection"}, "answer": "C", "explanation": "Loin pain and haematuria from cyst haemorrhage, hypertension, raised creatinine and relatives who died of a \"bleed in the brain\" (subarachnoid haemorrhage from a berry aneurysm) are the classic picture of ADPKD, an autosomal dominant disease. Medullary sponge kidney causes renal colic, small stones and haematuria but usually preserves renal function and does not cause hypertension or aneurysmal bleeds. \"Haemophelia\" is a typo for haemophilia.", "source": "Textbook only. Kumar & Clark p. 1405 (ADPKD clinical features and complications), p. 1406 (medullary sponge kidney).", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": true, "dupOf": null}, {"id": 75, "batch": "23rd Batch Q70", "bn": 23, "topic": "Bilateral loin masses, PKD", "type": "SBA", "lecture": "T", "stem": "A 45-year-old man on treatment for hypertension, presented with recurrent haematuria Examination revealed bilateral loin masses. What is the most likely diagnosis? (SBA)", "options": {"A": "Polycystic kidney disease", "B": "Renal cell carcinoma", "C": "Hydronephrosis", "D": "Metastatic deposits", "E": "Wilms tumour"}, "answer": "A", "explanation": "ADPKD gives large, irregular, bilateral kidneys on examination, and early, very common hypertension. Haematuria comes from bleeding into a cyst. Renal cell carcinoma mainly affects men after 50 and rarely before 40, and it is typically a unilateral mass (standard knowledge). Wilms tumour is a childhood tumour (standard knowledge). Hydronephrosis would not explain the hypertension and recurrent haematuria as well.", "source": "Textbook only. Kumar & Clark p. 1405 (ADPKD: physical examination, hypertension, haematuria), p. 1406 (renal cell carcinoma).", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": true, "dupOf": null}, {"id": 76, "batch": "33rd Batch Q9", "bn": 33, "topic": "Childhood polycystic kidney disease", "type": "MTF", "lecture": "T", "stem": "Childhood polycystic kidney disease: (MTF)", "options": {"A": "Rapidly progresses to renal failure in neonates", "B": "Causes portal hypertension", "C": "Is inherited autosomal recessive manner", "D": "Causes enlarged kidneys with a bosselated external surface", "E": "Is associated with Berry aneurysms"}, "answer": {"A": true, "B": true, "C": true, "D": false, "E": false}, "explanation": "Kumar & Clark describes the autosomal recessive form (PKHD1 gene) as often lethal in early life, which supports A and C. Congenital hepatic fibrosis with portal hypertension is the recognised liver association of the recessive form (standard knowledge). The kidneys in the recessive form are large with a smooth surface, so \"bosselated\" is false for D (standard knowledge). Berry aneurysms belong to ADPKD, as in Q74, so E is false.", "source": "Textbook only. Kumar & Clark p. 1405 (autosomal recessive form, PKHD1, lethal in early life; berry aneurysm under ADPKD). Portal hypertension and kidney surface are standard knowledge.", "confidence": "CHECK on B and D. The textbook is silent on portal hypertension and kidney surface in the recessive form, so both rest on standard knowledge. Best answer is A True, B True, C True, D False, E False.", "check": true, "checkLetters": ["B", "D"], "textbookDiffers": "", "textbookOnly": true, "dupOf": null}, {"id": 77, "batch": "32nd Batch Q13", "bn": 32, "topic": "Renal imaging pairs", "type": "MTF", "lecture": "T", "stem": "The following renal pathologies are correctly paired with the recommended imaging modalities for diagnosis: (MTF)", "options": {"A": "Renal scarring - DMSA scan", "B": "Posterior urethral valve - DTPA scan", "C": "Pelviureteric junction obstruction - MCUG", "D": "Nephrocalcinosis - Ultrasound KUB", "E": "Nephrolithiasis - X-ray KUB"}, "answer": {"A": true, "B": false, "C": false, "D": true, "E": true}, "explanation": "DMSA binds proximal tubular cells and shows scars as photon-deficient areas, so A is correct. DTPA assesses perfusion and filtration. Urethral valves are shown by contrast urethrography or MCUG, so B is false. MCUG looks for reflux and urethral anatomy. Obstruction at the pelviureteric junction is assessed by MAG3 renography, so C is false. Nephrocalcinosis (D) shows as echogenic medullary pyramids on ultrasound (standard knowledge). A plain abdominal X-ray identifies radiodense stones (E), though CT is first-line for suspected stones in adults.", "source": "Textbook only. Kumar & Clark p. 1351 (MCUG, DTPA, DMSA, MAG3), p. 1378 (urethrography for urethral valves), p. 1350 (plain X-ray and CT for calculi), p. 1376 (nephrocalcinosis).", "confidence": "CHECK on D and E. The textbook shows nephrocalcinosis on X-ray and does not name ultrasound KUB. It also makes CT, not X-ray, first-line for stones in adults. Best answer is A True, B False, C False, D True, E True.", "check": true, "checkLetters": ["D", "E"], "textbookDiffers": "", "textbookOnly": true, "dupOf": null}, {"id": 78, "batch": "31st Batch Q24", "bn": 31, "topic": "Posterior urethral valve in infant", "type": "SBA", "lecture": "T", "stem": "A 1-year-old child presented with 3rd episode of urinary tract infection with symptoms. On examination palpable bladder with ballotable masses present. Symptoms present from birth. What is the cause of this? (SBA)", "options": {"A": "Constipation", "B": "Unfunctional voiding", "C": "PVJ obstruction", "D": "Phimosis", "E": "Poster urethral valve"}, "answer": "E", "explanation": "In children, obstruction usually comes from congenital abnormalities or urethral valves. A palpable bladder shows outflow retention, ballotable masses show hydronephrotic kidneys, and infection is a major complication. This fits posterior urethral valves present from birth. Pelviureteric junction obstruction (the paper's \"PVJ\" is presumably a typo for PUJ) causes pelvic hydronephrosis but not bladder enlargement. \"Unfunctional\" and \"Poster\" are typos for dysfunctional and posterior.", "source": "Textbook only. Kumar & Clark p. 1377 (obstruction in children, signs, Box 36.22 congenital urethral valve), p. 1378 (pelviureteric junction obstruction).", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": true, "dupOf": null}, {"id": 79, "batch": "26th Batch Q69", "bn": 26, "topic": "Clinical clue to posterior urethral valve", "type": "SBA", "lecture": "T", "stem": "A nine-month-old boy has a 3 day history of high fever, vomiting and crying while passing urine. A diagnosis of urinary tract infection is made based on investigations. What clinical feature would best indicate that there is a possibility of an underling posterior urethral valve? (SBA)", "options": {"A": "A palpable bladder after voiding", "B": "Failure to thrive", "C": "History of recurrent UTI", "D": "Presence of renal angle tenderness", "E": "Reduced urine output"}, "answer": "A", "explanation": "In children, obstruction usually results from congenital abnormalities or urethral valves. A bladder still palpable after voiding shows outflow obstruction with retention, which is the textbook sign of an enlarged bladder in retention. This matches the palpable bladder used for Q78. Recurrent UTI and renal angle tenderness are non-specific and occur in other urinary tract problems such as reflux and pyelonephritis (standard knowledge). \"Underling\" is a typo for underlying.", "source": "Textbook only. Kumar & Clark p. 1377 (obstruction in children, palpable bladder in retention, Box 36.22 congenital urethral valve), p. 1378 (urethrography for urethral valves). Post-void palpability as the key clue is standard knowledge.", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": true, "dupOf": null}, {"id": 80, "batch": "25th Batch Q33", "bn": 25, "topic": "Vesicoureteric reflux", "type": "MTF", "lecture": "2", "stem": "Which of the following is/are true or false regarding vesico-ureteric reflux (VUR) ? (MTF)", "options": {"A": "It is associated with posterior urethral valves.", "B": "It is best diagnosed by intravenous urogram.", "C": "Mid dilation of ureter is seen in grade 1 VUR.", "D": "Scarring of the kidney is due to intra renal reflux.", "E": "Surgery is the treatment of choice for grade 3 VUR."}, "answer": {"A": true, "B": false, "C": false, "D": true, "E": false}, "explanation": "VUR is commonly secondary to posterior urethral valves because of high voiding pressures (standard knowledge). MCUG, not IVU, is the test for reflux: contrast is screened during voiding in children with recurrent infection. Scarring follows reflux of infected urine into the kidney (intrarenal reflux), as in reflux nephropathy. In the usual international grading, grade 1 reflux reaches the ureter without dilatation (the \"Mid\" in C is a typo for \"Mild\"), and low grades such as grade 3 are managed with antibiotic prophylaxis, since K&C notes no proven long-term benefit from re-implantation surgery.", "source": "UTI in adults lecture, Chronic pyelonephritis slide (VUR in children, scarring). Kumar & Clark p. 1351 (MCUG) and p. 1383 (reflux nephropathy, prophylaxis, re-implantation). Standard knowledge for the PUV association, VUR grading and the term intrarenal reflux.", "confidence": "CHECK on C. VUR grading is not in the lecture or K&C, and \"Mid\" is a typo, so the examiner's intent is unclear. Best answer is False.", "check": true, "checkLetters": ["C"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 81, "batch": "23rd Batch Q60", "bn": 23, "topic": "Clinical clue to posterior urethral valve", "type": "SBA", "lecture": "T", "stem": "A 3-months-old baby boy has repeated vomiting. Ultra sound scan of the abdomen shows bilateral gross hydronephrosis. Which clinical feature best suggests posterior urethral valve as the likely aetiology? (SBA)", "options": {"A": "Bilateral loin masses", "B": "Associated hypospadias", "C": "Generalised oedema", "D": "Hypertension", "E": "Palpable bladder"}, "answer": "E", "explanation": "Bilateral hydronephrosis plus a palpable bladder points to obstruction at or below the bladder outlet, and urethral valves are the recognised congenital cause in children. The answer is consistent with Q78 and Q79. Bilateral loin masses only restate the hydronephrosis already seen on scan, so they do not point to the level of obstruction. Hypospadias and hypertension do not localise the obstruction to the urethra (standard knowledge).", "source": "Textbook only. Kumar & Clark p. 1377 (obstruction in children, palpable bladder in retention, Box 36.22 congenital urethral valve), p. 1378 (urethrography for urethral valves).", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": true, "dupOf": null}, {"id": 82, "batch": "31st Batch Q13", "bn": 31, "topic": "UTI in children, investigations", "type": "MTF", "lecture": "2", "stem": "Which of the following are true/false regarding UTI in children? (MTF)", "options": {"A": "Any number of organisms in clean catch midstream urine sample confirm the diagnosis", "B": "DMSA is used to identify the differential function of the kidney", "C": "Micturating cystourethrogram confirms the diagnosis of vesicoureteral reflux", "D": "USS is the investigation of choice in the diagnosis of posterior urethral valve", "E": "Dysmorphic red cells help to identify glomerular hematuria"}, "answer": {"A": false, "B": true, "C": true, "D": false, "E": true}, "explanation": "The lecture requires a significant count (more than 10⁵ CFU/mL from a clean-catch midstream sample) for diagnosis, so \"any number\" is wrong. DMSA binds proximal tubular cells and shows relative function and scars, and MCUG is the test for reflux in children with recurrent infection. Dysmorphic red cells indicate glomerular bleeding. PUV is confirmed on voiding urethrography (MCUG), whereas USS only shows its effects such as dilated tracts (standard knowledge).", "source": "UTI in adults lecture, Lab Investigations slide (urine culture threshold). Haematuria lecture, \"Dysmorphic red cells in urine: glomerular blood\" slide. Kumar & Clark p. 1349 (dysmorphic cells), p. 1351 (DMSA, MCUG), p. 1378 (urethrography for valves).", "confidence": "CHECK on D. The lecture is silent on PUV. K&C p. 1378 supports voiding urethrography for valves, but p. 1377 calls USS the investigation of choice for upper-tract dilatation, so the examiner's source may differ. Best answer is False.", "check": true, "checkLetters": ["D"], "textbookDiffers": "K&C Box 36.26 (p. 1382) accepts 10² or more coliforms/mL with pyuria in symptomatic young women, lower than the lecture's 10⁵ CFU/mL. The answer to A is unchanged. CHECK", "textbookOnly": false, "dupOf": null}, {"id": 83, "batch": "29th Batch Q27", "bn": 29, "topic": "UTI in children", "type": "MTF", "lecture": "2", "stem": "Regarding UTI in children, (MTF)", "options": {"A": "Girls have a higher incidence in infancy than boys", "B": "Inadequate water intake is a cause", "C": "Causative agent commonly reaches the renal tract via the blood stream", "D": "Vesicoureteral reflux is a predisposing factor", "E": "Viruses are a known cause of cystitis"}, "answer": {"A": false, "B": true, "C": false, "D": true, "E": true}, "explanation": "K&C states infection usually ascends from the patient's own bowel flora and only rarely arises from the bloodstream, so C is wrong. Urine stasis promotes UTI and the lecture's prevention advice includes increased fluid intake, so poor intake is a predisposing factor. VUR is a predisposing factor (K&C lists it under complicated UTI). Viral (adenovirus) cystitis in children and the boys-first-then-girls sex ratio in infancy are standard knowledge.", "source": "UTI in adults lecture, Introduction and Epidemiology slides, Prevention of Recurrent UTI slide, Chronic pyelonephritis slide. Kumar & Clark p. 1381 (route of infection, stasis), p. 1383 (reflux, Fig. 36.37). Standard knowledge for A and E.", "confidence": "CHECK on A, B and E. A: the sex ratio in infancy is not in the lecture or K&C; the standard teaching is that boys predominate in the first 3 months and girls later. B: the lecture supports fluid intake only as prevention, so \"cause\" is a stretch. E: the lecture's organism list has no viruses. Best answers are A False, B True, E True.", "check": true, "checkLetters": ["A", "B", "E"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 84, "batch": "28th Batch Q26", "bn": 28, "topic": "UTI organisms in children", "type": "MTF", "lecture": "2", "stem": "Aetiological agent/s responsible for UTI in children include (MTF)", "options": {"A": "E. Coli", "B": "Pseudomonas aeruginosa", "C": "Adenovirus", "D": "Streptococcus pneumonia", "E": "Haemophilus influenza"}, "answer": {"A": true, "B": true, "C": true, "D": false, "E": false}, "explanation": "E. coli is the most common cause, and the lecture's KEEPS list includes Pseudomonas. Adenovirus is a recognised cause of haemorrhagic cystitis in children (standard knowledge). Streptococcus pneumoniae and Haemophilus influenzae are not urinary pathogens in the lecture or K&C (the options carry the typos \"pneumonia\" and \"influenza\").", "source": "UTI in adults lecture, Organisms (KEEPS) slide. Kumar & Clark p. 1381 (Box 36.25). Standard knowledge for adenovirus.", "confidence": "CHECK on C. The lecture's organism list does not include viruses, but adenovirus cystitis is standard knowledge, and this answer is kept consistent with Q83 E. Best answer is True.", "check": true, "checkLetters": ["C"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 85, "batch": "27th Batch Q33", "bn": 27, "topic": "UTI in children", "type": "MTF", "lecture": "2", "stem": "Regarding UTI in children, (MTF)", "options": {"A": "Asymptomatic bacteriuria requires prompt treatment", "B": "Enterobius vermicularisinfection is a predisposing factor", "C": "Escherichia coli is the most common pathogen", "D": "Incidence is less in exclusively breast fed babies than formula fed babies", "E": "Pyelonephritis requires parenteral antibiotic therapy"}, "answer": {"A": false, "B": true, "C": true, "D": true, "E": true}, "explanation": "The lecture says not to treat asymptomatic bacteriuria except in pregnancy or before urological procedures, so A is wrong. E. coli is the most common pathogen. Threadworm infection predisposes by carrying bowel organisms to the perineum, and breast-feeding is protective (both standard knowledge). The lecture gives IV antibiotics for severe or hospitalised pyelonephritis (ampicillin-clavulanate, ceftriaxone or ceftazidime, meropenem if ESBL is suspected), and K&C gives IV therapy for the acutely ill patient with fever and loin pain.", "source": "UTI in adults lecture, Treatment Guidelines slide (asymptomatic bacteriuria), Organisms slide, Management of acute pyelonephritis slide. Kumar & Clark p. 1381 (Box 36.25), p. 1384 (IV antibiotics). Standard knowledge for B and D.", "confidence": "CHECK on E. The lecture is about adults and allows oral treatment for mild outpatient pyelonephritis, so \"requires\" is not absolute; in children, parenteral treatment is the usual start (standard knowledge). Best answer is True.", "check": true, "checkLetters": ["E"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 87, "batch": "32nd Batch Q19", "bn": 32, "topic": "Best test to diagnose nephrotic syndrome in a child", "type": "SBA", "lecture": "3", "stem": "A 4-year-old child presents with generalized edema and reduced urine output for three days. On examination, periorbital edema, ankle edema, and ascites are noted. Which of the following is the best investigation for diagnosing nephrotic syndrome?", "options": {"A": "High serum creatinine", "B": "High serum triglycerides", "C": "Low serum albumin", "D": "Low serum sodium", "E": "High hematocrit"}, "answer": "C", "explanation": "Hypoalbuminaemia (<30 g/L) is part of the defining tetrad in the lecture, and serum albumin is listed among the basic investigations. Raised triglycerides are found in only about 50% of patients, so they are not diagnostic. Serum creatinine may be normal or raised and does not define nephrotic syndrome. Urinary protein (>3.5 g/day or protein/creatinine ratio >3.5) is the other key test but is not offered here.", "source": "3 Nephrotic Syndrome, slides \"What is the Nephrotic Syndrome?\" and \"Basic Investigations in Nephrotic Syndrome\".", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 88, "batch": "30th Batch Q20", "bn": 30, "topic": "Commonest pathology in childhood nephrotic syndrome", "type": "SBA", "lecture": "3", "stem": "A 3 year old boy is diagnosed with nephritis syndrome. What is the most likely renal pathology expected in this child?", "options": {"A": "Focal segmental glomerulosclerosis.", "B": "IgA nephropathy", "C": "Membranous proliferative GN", "D": "Membranous Nephropathy", "E": "Minimal Change Disease"}, "answer": "E", "explanation": "Minimal change disease causes about 90% of nephrotic syndrome in children, as the lecture summary states. The stem says \"nephritis syndrome\", which is almost certainly a typo for nephrotic, and option C \"Membranous proliferative GN\" is a typo for membranoproliferative. FSGS and membranous nephropathy are adult-predominant causes in the lecture.", "source": "3 Nephrotic Syndrome, slides \"Causes of Nephrotic Syndrome\", \"Clinical Features of MCN\" and \"Summary\".", "confidence": "CHECK on E. The stem says \"nephritis syndrome\", which is probably a typo for nephrotic, and no option is a classic nephritic cause in a 3-year-old. Best answer is E.", "check": true, "checkLetters": ["E"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 89, "batch": "28th Batch Q63", "bn": 28, "topic": "Next investigation in a child with ++++ proteinuria", "type": "SBA", "lecture": "3", "stem": "A 4-year-old boy presented with gradually worsening periorbital and ankle swelling for 3 days. On examination he had marked periorbital oedema and gross ascites. Urine ward test was performed and it was positive with ++++ proteinuria. What is the most appropriate next investigation, to arrive at a diagnosis?", "options": {"A": "ALT", "B": "ASOT", "C": "Serum albumin", "D": "Serum creatinine", "E": "Urine culture"}, "answer": "C", "explanation": "Oedema with ascites and heavy proteinuria suggests nephrotic syndrome, and the next step is to show hypoalbuminaemia (<30 g/L). This is consistent with Q87. ASOT looks for post-streptococcal nephritis, which presents with haematuria, hypertension and oliguria rather than heavy proteinuria with ascites. \"Urine ward test\" is a typo for a urine bedside (dipstick) test.", "source": "3 Nephrotic Syndrome, slides \"What is the Nephrotic Syndrome?\" and \"Basic Investigations in Nephrotic Syndrome\".", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 91, "batch": "33rd Batch Q18", "bn": 33, "topic": "Post-streptococcal GN in a child", "type": "SBA", "lecture": "4", "stem": "12y old girl presented with cola colored urine and facial puffiness for 5d.she had a sore throat 2 weeks ago which resolves spontaneously without any treatment.on examination there's perorbital oedema.her bp was 145/95.urinalysis showed proteinuria, red cells and red cell casts.what is the diagnosis? (SBA)", "options": {"A": "Acute diffuse proliferative glomerulonephritis", "B": "IgA neohropathy", "C": "Membranoproliferative glomerulonephritis", "D": "Minimal change disease", "E": "Rapid proliferative glomeronephritis"}, "answer": "A", "explanation": "This is a child with an acute nephritic picture (haematuria with red-cell casts, non-nephrotic proteinuria, hypertension, periorbital oedema) 2 weeks after a sore throat. That matches the 1-3 week latent interval of PSGN, whose biopsy shows diffuse, florid, acute inflammation, which is the histological pattern named in option A. IgA nephropathy (B) causes haematuria within days of the infection (see Q54). RPGN (E) would show rapidly rising creatinine over weeks, which is not described. The term \"proliferative\" is standard knowledge, since the lecture describes the lesion as diffuse, florid, acute inflammation. The stem and options have typos (\"perorbital\", \"neohropathy\", \"glomeronephritis\").", "source": "04Glomerulonephritis lecture, Acute Nephritis slide and Post-Streptococcal Glomerulonephritis slide.", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 92, "batch": "33rd Batch Q19", "bn": 33, "topic": "Henoch-Schönlein purpura, renal biopsy", "type": "SBA", "lecture": "7", "stem": "10 years old boy presented with a rash, lower limb arthralgia and abdominal pain. Microscopic heamaturea and proteinura was present. Renal biopsy findings are,", "options": {"A": "Crescent formation", "B": "Focal segmental glomerular sclerosis", "C": "Glomalar basement membrane thickening", "D": "Mesengeal proliferation", "E": "Wire loops"}, "answer": "D", "explanation": "Rash, arthralgia, abdominal pain and haematuria/proteinuria in a child is IgA vasculitis (Henoch-Schönlein syndrome). The lecture gives the histology as focal segmental proliferative glomerulonephritis similar to IgA nephropathy, and Lecture 4 describes mesangial IgA deposits. Kumar & Clark adds that mesangial hypercellularity may be present and that epithelial crescents occur only in more severe cases, so A is not the typical finding. B is a sclerosing lesion, and wire loops (E) are a lupus feature (standard knowledge). Typos: \"heamaturea\", \"proteinura\", \"Glomalar\", \"Mesengeal\".", "source": "Lecture 7, slide \"Immunoglobulin A Vasculitis (Henoch-Schönlein Syndrome)\"; Lecture 4, slide \"IgA Nephropathy\"; Kumar & Clark p.1361 and p.1367.", "confidence": "CHECK on A. Lecture 4 says crescents are frequent in IgA nephropathy after macroscopic haematuria, so a \"severe disease\" key could favour A. Best answer is D.", "check": true, "checkLetters": ["A"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 93, "batch": "32nd Batch Q7", "bn": 32, "topic": "Secondary causes of acute GN in children", "type": "MTF", "lecture": "4", "stem": "Well-recognized secondary causes of acute glomerulonephritis in children include: (MTF)", "options": {"A": "Goodpasture syndrome", "B": "Systemic lupus erythematosus (SLE)", "C": "Henoch-Schönlein purpura", "D": "Hepatitis B", "E": "Sickle cell disease"}, "answer": {"A": false, "B": true, "C": true, "D": true, "E": false}, "explanation": "The lecture lists infective endocarditis, shunt nephritis and visceral abscess as other acute GN causes, and notes HSP as an IgA nephropathy association. SLE, HSP and hepatitis B are named in Kumar & Clark's list of diseases associated with the acute nephritic syndrome. Goodpasture syndrome (A) is a rare cause of RPGN, mainly in adults, so it is not a well-recognized cause in children (standard knowledge). Sickle cell disease (E) rarely affects the glomerulus.", "source": "04Glomerulonephritis lecture, Other Acute GN Causes slide and IgA Nephropathy slide (HSP); Kumar & Clark p. 1361 (Box 36.14), p. 1368 (sickle nephropathy).", "confidence": "CHECK on A and D. The lecture does not name SLE, hepatitis B or Goodpasture in children, and Goodpasture could be counted as a nephritic cause. Best answer is A False and D True.", "check": true, "checkLetters": ["A", "D"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 94, "batch": "31st Batch Q19", "bn": 31, "topic": "Non-post-streptococcal acute nephritis clue", "type": "SBA", "lecture": "4", "stem": "A 10-year-old girl was admitted with gross hematuria, oliguria, and periorbital swelling. Acute nephritic syndrome is suspected. Which of the following is suggestive of non-post streptococcal etiology for acute glomerulonephritis of this child? (SBA)", "options": {"A": "Mild elevation of serum creatinine value", "B": "Preceding skin sepsis for the past 2 weeks", "C": "Presence of hypertension", "D": "Purpura in the lower limbs", "E": "RBC cast in urine"}, "answer": "D", "explanation": "The lecture links IgA nephropathy with Henoch-Schönlein purpura, and a purpuric rash is also a feature of vasculitis. Purpura therefore points away from PSGN towards HSP or vasculitis. Skin sepsis 1-3 weeks earlier (B) is a recognised PSGN trigger (the lecture lists cellulitis), and hypertension, a mild creatinine rise and red-cell casts (A, C, E) are all features of acute nephritis in general.", "source": "04Glomerulonephritis lecture, IgA Nephropathy slide (HSP association); ANCA-positive Vasculitis slide (purpuric rash); Post-Streptococcal Glomerulonephritis slide.", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 95, "batch": "29th Batch Q64", "bn": 29, "topic": "Feature supporting PSGN", "type": "SBA", "lecture": "4", "stem": "6-year-old boy has developed macroscopic hematuria and periorbital oedema. Which of the following feature is most suggestive of a diagnosis of an acute post streptococcal glomerulonephritis? (SBA)", "options": {"A": "Blood pressure above 90 centile", "B": "Infected purpureal urticaria", "C": "Oliguria", "D": "Raised Anti streptolysin O titre", "E": "Recurrent episodes of hematuria"}, "answer": "D", "explanation": "PSGN follows a group A β-haemolytic streptococcal infection, and the lecture lists ASOT among the serological tests to request when it is suspected. A raised titre is the only option that shows a recent streptococcal infection. Hypertension and oliguria (A, C) occur in any acute nephritis. Recurrent haematuria (E) points to IgA nephropathy, as the lecture describes. The skin infection in B can be a trigger, but it does not confirm a streptococcal cause. \"Purpureal urticaria\" is probably a typo for papular urticaria.", "source": "04Glomerulonephritis lecture, Post-Streptococcal Glomerulonephritis slide and Investigation of Glomerular Disease slide (ASOT); Kumar & Clark p. 1350, Box 36.9 (p. 1353).", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 96, "batch": "27th Batch Q30", "bn": 27, "topic": "Post-streptococcal GN statements", "type": "MTF", "lecture": "4", "stem": "Regarding post streptococcal glomerulonephritis, (MTF)", "options": {"A": "Followed by infection of group A beta hemolytic Streptococci.", "B": "It is the commonest cause of gross hematuria in children.", "C": "Renal biopsy is indicated in diagnosis.", "D": "Serum complement levels are normal in acute stage.", "E": "Treatment as oral penicillin results in rapid recovery."}, "answer": {"A": true, "B": false, "C": false, "D": false, "E": false}, "explanation": "The lecture gives the trigger as a nephritogenic Lancefield group A β-haemolytic streptococcus 1-3 weeks earlier (A). It names IgA nephropathy as the most common GN worldwide, with PSGN rare in developed countries, so B is False on the lecture's wording. Biopsy findings are described, but diagnosis is clinical and biopsy is only \"when indicated\" (C), which is standard knowledge. Complement (C3) is low in the acute stage (D), as Kumar & Clark states. The lecture gives penicillin to eradicate the infection and supportive care for recovery, not rapid recovery (E).", "source": "04Glomerulonephritis lecture, Post-Streptococcal Glomerulonephritis slide, Management of PSGN slide, Prognosis in PSGN slide, IgA Nephropathy slide (\"most common GN worldwide\"); Kumar & Clark p. 1350 (complement low in PSGN), p. 1361.", "confidence": "CHECK on B and E. B: paediatric teaching often calls PSGN the commonest cause of gross haematuria in children, but the lecture and Kumar & Clark both rank IgA nephropathy as the most common GN. E: the lecture says penicillin eradicates infection and does not claim faster recovery. Best answer is B False and E False.", "check": true, "checkLetters": ["B", "E"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 97, "batch": "25th Batch Q27", "bn": 25, "topic": "Childhood nephritic syndrome statements", "type": "MTF", "lecture": "4", "stem": "In childhood nephritic syndrome, (MTF)", "options": {"A": "Macroscopic hematuria is an indication for renal biopsy.", "B": "Hypertension is due to fluid retention.", "C": "C3 complement levels are persistently depressed in post streptococcal glomerulonephritis.", "D": "Focal proliferative changes in a renal biopsy is a poor prognostic factor.", "E": "Methyldopa is the first line drug in the treatment of hypertension."}, "answer": {"A": false, "B": true, "C": false, "D": false, "E": false}, "explanation": "The lecture's PSGN management is supportive: antihypertensives, diuretics and salt restriction for oedema. The hypertension is due to salt and water retention (B, standard knowledge). Macroscopic haematuria alone is not a biopsy indication (A), consistent with Q96 C. Complement is low only in the acute phase and then recovers, so C is False, consistent with Q96 D. Kumar & Clark describes persistently low C3 in mesangiocapillary GN type 1. The lecture says the prognosis in children is excellent and its poor-prognosis list (for IgA nephropathy) does not include focal proliferative change (D). It names no first-line antihypertensive, and methyldopa is not the usual choice (E, standard knowledge).", "source": "04Glomerulonephritis lecture, Management of PSGN slide, Prognosis in PSGN slide, IgA Nephropathy – Prognosis slide; Kumar & Clark p. 1350, p. 1365.", "confidence": "CHECK on D. The lecture does not discuss focal proliferative changes as a prognostic factor in childhood nephritis, so this is mostly standard knowledge. Best answer is D False.", "check": true, "checkLetters": ["D"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 98, "batch": "23rd Batch Q34", "bn": 23, "topic": "IgA nephropathy statements", "type": "MTF", "lecture": "4", "stem": "IgA nephropathy (MTF)", "options": {"A": "results from immune-complex formation.", "B": "is known to follow an upper respiratory tract infection", "C": "is commoner in the paediatric age group compared to adults", "D": "presents with painless haematuria", "E": "leads to rapid deterioration of renal function"}, "answer": {"A": false, "B": true, "C": true, "D": true, "E": false}, "explanation": "The lecture's pathogenesis slide lists IgA under \"atypical immunoglobulin deposition\", separate from immune complex deposition, so by the lecture A is False. The lecture says the macroscopic haematuria often follows an upper respiratory or GI viral infection (B). It also says the disease affects children and young males predominantly (C) and presents with microscopic or recurrent macroscopic haematuria, usually without pain (D). The overall ESKD risk is about 25% and recurrent macroscopic haematuria is a good prognostic sign, so rapid deterioration (E) is not typical.", "source": "04Glomerulonephritis lecture, Pathogenesis slide, IgA Nephropathy – Clinical Features slide, IgA Nephropathy – Prognosis slide.", "confidence": "CHECK on A. Classifying IgA under \"atypical immunoglobulin deposition\" is my reading of that slide. Best answer is A False, keeping the lecture answer.", "check": true, "checkLetters": ["A"], "textbookDiffers": "Kumar & Clark (pp. 1361–1362) describes IgA-rich immune complexes, made of galactose-deficient IgA1 and glycan-specific IgG, deposited in the mesangium. On that wording A would be True. CHECK", "textbookOnly": false, "dupOf": null}, {"id": 99, "batch": "32nd Batch Q24", "bn": 32, "topic": "Small echogenic kidneys in a child", "type": "SBA", "lecture": "8", "stem": "A 10-year-old boy presents with malaise, lethargy, growth failure, and bilateral ankle edema. Ultrasound reveals bilaterally small kidneys with increased echogenicity. What is the most likely diagnosis? (SBA)", "options": {"A": "Acute glomerulonephritis", "B": "Chronic kidney disease (CKD)", "C": "Nephrotic syndrome", "D": "Polycystic kidney disease", "E": "Urinary tract infection (UTI)"}, "answer": "B", "explanation": "Malaise, fluid retention and impaired growth in uraemic children are features of advanced CKD in the lecture. Kumar & Clark states that small, scarred (increased echogenicity) kidneys suggest a longstanding process. Polycystic kidney disease would give enlarged kidneys, since the lecture notes kidneys are rarely palpable except in ADPKD, and nephrotic syndrome does not produce small echogenic kidneys (standard knowledge).", "source": "8 Chronic Kidney Disease, Symptoms by CKD Stage, Physical Examination and Endocrine Abnormalities slides; Kumar & Clark, AKI section \"Acute or chronic uraemia?\" (page not confirmed).", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 100, "batch": "31st Batch Q27", "bn": 31, "topic": "CKD versus AKI features in a child", "type": "SBA", "lecture": "8", "stem": "An 8-year-old girl with recurrent UTI was admitted with a seizure. BP was 190/110 mmHg Serum creatinine was 3.4 (0.2-0.6). Which is more supportive for CKD rather than AKI? (SBA)", "options": {"A": "Acidosis", "B": "Anemia", "C": "Headache", "D": "Hyperkalemia", "E": "Oliguria"}, "answer": "B", "explanation": "The lecture describes a normochromic normocytic anaemia from reduced erythropoietin as a feature of CKD, and the AKI lecture lists anaemia and bone disease as signs of CKD when judging whether a raised creatinine is acute or chronic. Acidosis, hyperkalaemia and headache can occur in both AKI and CKD (standard knowledge), and oliguria points more towards AKI (standard knowledge). The raised BP and seizure do not separate the two.", "source": "8 Chronic Kidney Disease, Anaemia slide; 5 AKI, Investigation of AKI (Initial Assessment) slide; Kumar & Clark, AKI section \"Acute or chronic uraemia?\" (page not confirmed).", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 101, "batch": "30th Batch Q26", "bn": 30, "topic": "Anaemia in a child with CKD", "type": "SBA", "lecture": "8", "stem": "A 5 year old child with CKD presents with anemia.\nRed cell parameters are as given below.\n• MCV-88\n• MCH- 29\n• RDW- 13\nWhich of the following is the most appropriate management for this child? (SBA)", "options": {"A": "Dietary Fe supplement", "B": "Folic acid", "C": "Oral iron therapy", "D": "Subcutaneous erythropoietin", "E": "Vit.B12 therapy"}, "answer": "D", "explanation": "The lecture describes CKD anaemia as normochromic and normocytic, with decreased erythropoietin production as the primary cause. These indices are in the normal range, which points away from iron, folate or B12 deficiency (standard knowledge), so replacing the erythropoietin with subcutaneous ESA is the treatment. Oral iron or other haematinics are wrong because no deficiency pattern is shown; the lecture lists haematinics only for treatable deficiencies.", "source": "8 Chronic Kidney Disease, Anaemia and Management of Anaemia slides; Kumar & Clark p. 1394.", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 102, "batch": "28th Batch Q64", "bn": 28, "topic": "Factor driving CKD progression in a child", "type": "SBA", "lecture": "8", "stem": "What is the most responsible factor from these which cause the progression of kidney damage in a child with chronic kidney disease. (SBA)", "options": {"A": "Hyperphosphataemia", "B": "Hypertension", "C": "Hyperfiltration injury", "D": "Anaemia", "E": "Proteinuria"}, "answer": "B", "explanation": "The lecture lists uncontrolled hypertension first among the factors associated with progression, and its summary links progression to proteinuria and uncontrolled hypertension. Kumar & Clark also puts hypertension first in the factors that the prognosis of CKD correlates with. Proteinuria (E) is the main alternative, and hyperfiltration (C) is described only in the textbook as a common pathway. Hyperphosphataemia and anaemia are complications rather than the main drivers. This keeps the answer consistent with the 24th Batch question on the factor that most affects CKD progression, where systemic hypertension is the matching option.", "source": "8 Chronic Kidney Disease, Progression of CKD and Summary slides; Kumar & Clark pp. 1393–1394.", "confidence": "CHECK on B. Proteinuria and hyperfiltration are both supported as progression factors, and the lecture does not rank them. Best answer is B.", "check": true, "checkLetters": ["B"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 103, "batch": "29th Batch Q38", "bn": 29, "topic": "CKD in children", "type": "MTF", "lecture": "8", "stem": "Regarding CKD in children, (MTF)", "options": {"A": "It causes precocious pu
