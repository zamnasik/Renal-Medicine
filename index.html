berty", "B": "It is a contraindication for breastfeeding", "C": "It is an indication for growth hormone therapy", "D": "It is classified as stage V when the GFR is less than 25 mL / min / 1.73m2", "E": "Prosthetic urethral valve is a known cause"}, "answer": {"A": false, "B": false, "C": true, "D": false, "E": true}, "explanation": "The lecture describes impaired growth in uraemic children from abnormal growth hormone secretion and action, and Kumar & Clark says recombinant growth hormone is used for this. CKD does not cause precocious puberty, and it is not a contraindication to breastfeeding (both standard knowledge). Stage 5 is GFR below 15 in the lecture, not 25. \"Prosthetic urethral valve\" in E is a typo for posterior urethral valve, which is an obstructive uropathy cause of childhood CKD (standard knowledge).", "source": "8 Chronic Kidney Disease, Endocrine Abnormalities and Classification of CKD slides; Kumar & Clark p. 1397.", "confidence": "CHECK on E. The wording is a typo, and the lecture's obstructive causes are adult ones only, so the True call rests on standard knowledge. Best answer is True.", "check": true, "checkLetters": ["E"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 104, "batch": "25th Batch Q63", "bn": 25, "topic": "Anaemia in a child with stage 4 CKD", "type": "SBA", "lecture": "8", "stem": "An 8-year-old girl with stage 4 chronic kidney disease is clinically pale. Her abdominal examination is unremarkable. Her haemoglobin is 7.5 g/dl and the blood picture is reported as normochromic normocytic anaemia. What is the most appropriate treatment for her anaemia? (SBA)", "options": {"A": "Blood transfusion", "B": "Dilatory advise", "C": "Folic acid", "D": "Iron", "E": "Recombinant human erythropoietin"}, "answer": "E", "explanation": "A normochromic normocytic picture in CKD reflects reduced erythropoietin production, and the lecture's treatment is recombinant human ESA given subcutaneously or IV. Blood transfusion (A) is wrong because the lecture says to avoid it, as HLA sensitisation is a barrier to kidney transplantation. Folic acid and iron are wrong because no deficiency is described. Typo: \"Dilatory advise\" in B means dietary advice. The answer matches Q37 and Q101.", "source": "8 Chronic Kidney Disease, Anaemia and Management of Anaemia slides; Kumar & Clark p. 1394.", "confidence": "Confident", "check": false, "checkLetters": [], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}, {"id": 105, "batch": "24th Batch Q65", "bn": 24, "topic": "Renal rickets biochemistry", "type": "SBA", "lecture": "8", "stem": "A 5 year old boy who is in clinic followed up for CKD is assessed due to persistent bow legs. His investigation profile suggested that he had developed Rickets due to chronic illness. Which of the following best suggest that Rickets is due to renal impairment? (SBA)", "options": {"A": "High serum alkaline phosphate", "B": "High serum Calcium", "C": "High serum Phosphate", "D": "Low serum Calcium", "E": "Low serum Phosphate"}, "answer": "C", "explanation": "The lecture says osteomalacia from CKD-MBD causes rickets in children, and falling phosphate excretion leads to hyperphosphataemia with hypocalcaemia and a raised alkaline phosphatase. Low calcium and high ALP also occur in other forms of rickets (standard knowledge), whereas high phosphate points to renal impairment. High calcium (B) and low phosphate (E) do not fit CKD-MBD. Typo: \"alkaline phosphate\" in A means alkaline phosphatase.", "source": "8 Chronic Kidney Disease, Pathogenesis of CKD MBD and Osteomalacia slides.", "confidence": "CHECK on C. The lecture lists low calcium and raised ALP together with high phosphate, so singling out phosphate rests on standard knowledge. Best answer is C.", "check": true, "checkLetters": ["C"], "textbookDiffers": "", "textbookOnly": false, "dupOf": null}], "dups": [{"id": 11, "dupOf": 10, "batch": "29th Batch Q26"}, {"id": 28, "dupOf": 27, "batch": "29th Batch Q35"}, {"id": 32, "dupOf": 27, "batch": "23rd Batch Q37"}], "lectures": {"1": "Haematuria", "2": "UTI", "3": "Nephrotic syndrome", "4": "Glomerulonephritis", "5": "Acute kidney injury", "6": "Renovascular disease", "7": "Systemic disease & kidney", "8": "Chronic kidney disease", "9": "Dialysis & transplant", "T": "Textbook only"}, "groups": [{"name": "GFR and creatinine clearance", "ids": [1, 2, 3, 4, 5, 6, 7, 8], "tip": "Eight questions. Know: body surface area, 24-hour collection, MDRD and CKD-EPI inputs, inulin.", "times": 8}, {"name": "Haematuria basics (red cell casts, dysmorphic cells)", "ids": [9, 10, 12, 13], "tip": "Red cell casts mean glomerular bleeding. Cystoscopy in all macroscopic haematuria.", "times": 5}, {"name": "Urine ACR in diabetes", "ids": [57, 58, 59, 61, 64], "tip": "Microalbuminuria is the earliest marker. Repeat before labelling CKD.", "times": 5}, {"name": "Renal artery stenosis", "ids": [69, 70, 71, 72, 73], "tip": "Resistant hypertension, flash pulmonary oedema, creatinine rise on ACEi, bruit.", "times": 5}, {"name": "What drives CKD progression", "ids": [23, 24, 31, 102], "tip": "Hypertension and proteinuria. Interstitial scarring too.", "times": 4}, {"name": "UTI in children", "ids": [82, 83, 84, 85], "tip": "E. coli, reflux, breast-feeding, threadworms.", "times": 4}, {"name": "CKD drugs matched to problems", "ids": [35, 36, 41], "tip": "ESA for anaemia, alfacalcidol for bone, binders for phosphate, resin for K.", "times": 3}, {"name": "Anaemia of CKD", "ids": [37, 101, 104], "tip": "Normocytic normochromic: erythropoietin. Avoid transfusion.", "times": 3}, {"name": "CKD complications and causes matched", "ids": [27], "tip": "Printed three times (Q27, Q28, Q32). Same five pairs.", "times": 3}, {"name": "Haematuria after a throat infection", "ids": [48, 50, 54], "tip": "Within days: IgA nephropathy. After 1-3 weeks: post-streptococcal.", "times": 3}, {"name": "Posterior urethral valve clues", "ids": [78, 79, 81], "tip": "Palpable bladder, hydronephrosis, male infant.", "times": 3}, {"name": "Post-streptococcal GN features", "ids": [94, 95, 96], "tip": "Raised ASOT, low C3 early, 1-3 week gap.", "times": 3}, {"name": "Haemodialysis indications in AKI", "ids": [21, 22], "tip": "Refractory hyperkalaemia, acidosis, pericarditis, uraemic fits, pulmonary oedema.", "times": 2}, {"name": "Hyperkalaemia on ACE inhibitor / ARB", "ids": [17, 38], "tip": "Stop the drug that is causing it first.", "times": 2}, {"name": "Confirming CKD in an older hypertensive", "ids": [29, 33], "tip": "Small contracted kidneys on ultrasound. Anaemia otherwise.", "times": 2}, {"name": "Systemic diseases causing nephrotic syndrome", "ids": [67, 68], "tip": "Amyloidosis, SLE, diabetes yes. Vasculitis and scleroderma no.", "times": 2}, {"name": "Adult polycystic kidney disease", "ids": [74, 75], "tip": "Loin pain, haematuria, hypertension, berry aneurysm, bilateral masses.", "times": 2}, {"name": "Nephrotic child: which test next", "ids": [87, 89], "tip": "Serum albumin.", "times": 2}], "notes": {}}</script>
<script>

const Q = D.questions, LEC = D.lectures;

const LORDER = ['1','2','3','4','5','6','7','8','9','T'];
const lc = k => `var(--l${k})`;

/* ---- saved progress (guarded) ---- */
let mem = {done:{}, flag:{}, last:null};
const KEY = 'renalmed-v1';
try { const s = localStorage.getItem(KEY); if (s) mem = Object.assign(mem, JSON.parse(s)); } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch(e){} }

/* ---- helpers ---- */
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const k in (attrs||{})) {
    const v = attrs[k]; if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const isRep = q => !!q.printedAlso;
const lcol = q => lc(q.lecture);

/* ---- state ---- */
const S = { tab:'home', lec:'all', type:'all', show:'all', q:'', i:0, picks:{}, revealed:{}, quiz:null };
const TABS = [['home','Home'],['practice','Practice'],['hot','Hot topics'],['accepted','Accepted answers'],['verify','To verify'],['notes','Notes']];
const tabsEl = document.getElementById('tabs');
function drawTabs(){ tabsEl.replaceChildren(...TABS.map(([k,l]) => el('button',{class:S.tab===k?'on':'',onclick:()=>go(k)}, l))); }
function go(t, keep){ S.tab = t; if(!keep){S.i = 0;} drawTabs(); render(); document.querySelector('nav').scrollIntoView({block:'start'}); }

/* ---- feedback bits ---- */
function confetti(){
  const box = el('div',{class:'confetti'});
  const cols = ['#f4d27a','#14b8a6','#e11d74','#6366f1','#f59e0b','#fff'];
  for (let i=0;i<46;i++){
    const p = el('i',{style:`left:${Math.random()*100}%;background:${cols[i%cols.length]};animation-delay:${Math.random()*.5}s;animation-duration:${1.4+Math.random()*1.2}s`});
    box.append(p);
  }
  document.body.append(box); setTimeout(()=>box.remove(), 3200);
}
function toast(msg){ const t = el('div',{class:'toast'}, msg); document.body.append(t); setTimeout(()=>t.remove(), 2200); }
function countUp(node, to){
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) { node.textContent = to; return; }
  const t0 = performance.now(), d = 900;
  (function f(t){ const k = Math.min(1,(t-t0)/d); node.textContent = Math.round(to*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(f); })(t0);
}

/* ---- scoring ---- */
function score(q, p){
  if (q.type === 'SBA') return {got: p === q.answer ? 1 : 0, of: 1};
  let got = 0; for (const L of 'ABCDE') if (p && p[L] === q.answer[L]) got++;
  return {got, of: 5};
}
function complete(q){
  const p = S.picks[q.id]; if (!p) return false;
  return q.type === 'SBA' ? !!p : 'ABCDE'.split('').every(L => p[L] !== undefined);
}
function reveal(q){
  S.revealed[q.id] = true;
  if (complete(q)) {
    const s = score(q, S.picks[q.id]);
    mem.done[q.id] = {got:s.got, of:s.of, ok:s.got===s.of}; save();
    if (s.got === s.of) { confetti(); toast(['Perfect, Musliha! ✨','Mashaa Allah! 🌙','Spot on! 💚','Brilliant! ⭐'][Math.floor(Math.random()*4)]); }
  }
  render(true);
}
const ansText = q => q.type==='SBA' ? q.answer : 'ABCDE'.split('').map(L => L+' '+(q.answer[L]?'True':'False')).join(' · ');

/* ---- question card ---- */
function questionCard(q){
  mem.last = q.id; save();
  const rev = !!S.revealed[q.id];
  const p = S.picks[q.id] || (q.type==='MTF' ? {} : null);
  const card = el('div',{class:'card qcard',style:`--lc:${lcol(q)}`});
  const badges = el('div',{class:'badges'},
    el('span',{class:'b'},'Q'+q.id),
    el('span',{class:'b lec'}, LEC[q.lecture]),
    el('span',{class:'b'}, q.batch), el('span',{class:'b'}, q.type),
    q.check ? el('span',{class:'b chk'},'⚠ Check this one') : el('span',{class:'b ok'},'✓ Accepted answer'),
    q.textbookOnly ? el('span',{class:'b tb'},'📖 Textbook only') : null,
    isRep(q) ? el('span',{class:'b rep'},'↻ Printed '+(1+q.printedAlso.length)+' times') : null);
  card.append(badges, el('div',{class:'topic'}, q.topic), el('div',{class:'stem'}, q.stem));
  for (const L of Object.keys(q.options)) {
    const flagged = q.checkLetters.includes(L);
    if (q.type==='SBA') {
      let c = 'opt sba' + (p===L?' pick':'');
      if (rev) c = 'opt' + (L===q.answer ? ' good' : (p===L ? ' bad' : ''));
      card.append(el('div',{class:c,onclick:()=>{ if(!rev){S.picks[q.id]=L;render(true);} }},
        el('div',{class:'l'},L),
        el('div',{class:'tx'}, q.options[L], rev&&flagged ? el('div',{},el('span',{class:'chkmark'},'⚠ check this option')) : null)));
    } else {
      const mine = p[L]; let c = 'opt';
      if (rev) c += mine===undefined ? ' unans' : (mine===q.answer[L] ? ' good' : ' bad');
      const tf = el('div',{class:'tf'},
        ['True','False'].map(v => el('button',{class:mine===(v==='True')?'sel':'',disabled:rev,
          onclick:()=>{ S.picks[q.id]=Object.assign({},p,{[L]:v==='True'}); render(true); }}, v)));
      if (rev) { tf.append(el('span',{class:'key',style:`color:${q.answer[L]?'var(--ok)':'var(--bad)'}`}, 'Answer: '+(q.answer[L]?'True':'False')));
        if (flagged) tf.append(el('span',{class:'chkmark'},'⚠ check')); }
      card.append(el('div',{class:c}, el('div',{class:'l'},L), el('div',{class:'tx'}, q.options[L], tf)));
    }
  }
  const row = el('div',{class:'btnrow'});
  if (!rev) row.append(el('button',{class:'btn pri',onclick:()=>reveal(q)}, complete(q) ? 'Check my answer' : 'Show answer'));
  else row.append(el('button',{class:'btn',onclick:()=>{delete S.picks[q.id];delete S.revealed[q.id];render(true);}}, '↺ Try again'));
  row.append(el('button',{class:'btn',onclick:()=>{ mem.flag[q.id]?delete mem.flag[q.id]:mem.flag[q.id]=1; save(); render(true);}}, mem.flag[q.id]?'⚑ Flagged':'⚐ Flag'));
  card.append(row);
  if (rev) {
    const fin = el('div',{class:'final'});
    if (complete(q)) { const s = score(q,S.picks[q.id]);
      fin.append(el('div',{class:'verdict',style:`color:var(${s.got===s.of?'--ok':'--bad'})`}, q.type==='SBA'?(s.got?'✓ Correct':'✗ Not quite'):`Your score: ${s.got} / 5`)); }
    fin.append(el('div',{class:'verdict'}, 'Answer: '+ansText(q)));
    const x = el('div',{class:'exp'}, el('h4',{},'Why'), el('p',{}, q.explanation),
      el('h4',{},'Source'), el('p',{}, q.source), el('h4',{},'How sure are we?'), el('p',{}, q.confidence));
    fin.append(x);
    if (q.textbookDiffers) fin.append(el('div',{class:'warnbox'}, el('b',{},'Textbook differs: '), q.textbookDiffers));
    if (q.printedAlso) fin.append(el('div',{class:'hint',style:'margin-top:10px'}, '↻ This question was also printed as: '+q.printedAlso.join(', ')+' (options may be in a different order, same answers).'));
    card.append(fin);
  }
  return card;
}

/* ---- viewer ---- */
function viewer(list, emptyMsg){
  const root = el('div');
  if (!list.length) { root.append(el('div',{class:'empty'}, emptyMsg||'No questions match.')); return root; }
  if (S.i >= list.length) S.i = 0;
  const q = list[S.i];
  const doneN = list.filter(x => mem.done[x.id]).length;
  const dots = el('div',{class:'grid'}, list.map((x,k) => { const d = mem.done[x.id];
    return el('button',{class:'dot'+(k===S.i?' cur':'')+(d?(d.ok?' ok':' no'):'')+(mem.flag[x.id]?' fl':''),onclick:()=>{S.i=k;render();window.scrollTo({top:document.querySelector('nav').offsetTop,behavior:'smooth'});}}, ''+x.id); }));
  root.append(el('div',{class:'topbar'}, el('b',{},`Question ${S.i+1} of ${list.length}`), el('span',{class:'hint'},`${doneN} attempted`)),
    el('div',{class:'bar'}, el('i',{style:`width:${(S.i+1)/list.length*100}%`})),
    el('details',{class:'card'}, el('summary',{},'Jump to a question'), el('div',{class:'hint'},'Green = right · red = needs work · ⚑ = flagged'), dots));
  root.append(questionCard(q));
  root.append(el('div',{class:'btnrow',style:'justify-content:space-between'},
    el('button',{class:'btn',disabled:S.i===0,onclick:()=>step(-1)}, '← Previous'),
    el('button',{class:'btn pri',disabled:S.i===list.length-1,onclick:()=>step(1)}, 'Next →')));
  root._len = list.length; return root;
}
let curLen = 0;
function step(d){ S.i = Math.max(0, Math.min(curLen-1, S.i + d)); render(); document.querySelector('nav').scrollIntoView({behavior:'smooth'}); }
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (['practice','accepted','verify','hot'].includes(S.tab)) { if (e.key==='ArrowRight') step(1); if (e.key==='ArrowLeft') step(-1); }
});

/* ---- filters ---- */
function chipRow(label, opts, cur, set, colorFor){
  return el('div',{}, el('div',{class:'hint'},label),
    el('div',{class:'chips'}, opts.map(([k,l]) => el('span',{class:'chip'+(cur===k?' on':''),style:colorFor&&k!=='all'?`--c:${colorFor(k)}`:'',onclick:()=>set(k)}, l))));
}
function baseList(){
  let l = S.quiz ? S.quiz.map(i => byId[i]) : Q.slice();
  if (S.lec !== 'all') l = l.filter(q => q.lecture === S.lec);
  if (S.type !== 'all') l = l.filter(q => q.type === S.type);
  if (S.q) { const t = S.q.toLowerCase(); l = l.filter(q => ('q'+q.id+' '+q.topic+' '+q.stem+' '+Object.values(q.options).join(' ')).toLowerCase().includes(t)); }
  return l;
}
function filterCard(withShow){
  const c = el('div',{class:'card'},
    el('input',{type:'search',placeholder:'🔍 Search topic or words…',value:S.q,oninput:e=>{S.q=e.target.value;S.i=0;render(true);}}),
    chipRow('Lecture',[['all','All'],...LORDER.filter(k=>Q.some(q=>q.lecture===k)).map(k=>[k,LEC[k]])],S.lec,v=>{S.lec=v;S.i=0;render();},lc),
    chipRow('Type',[['all','All'],['MTF','MTF'],['SBA','SBA']],S.type,v=>{S.type=v;S.i=0;render();}));
  if (withShow) c.append(chipRow('Show',[['all','All'],['todo','Not tried'],['wrong','Wrong ones'],['flag','Flagged']],S.show,v=>{S.show=v;S.i=0;render();}));
  if (S.quiz) c.append(el('div',{class:'btnrow',style:'margin-top:0'}, el('span',{class:'b lec',style:'--lc:var(--rose)'},'Random 10 quiz'), el('button',{class:'btn',onclick:()=>{S.quiz=null;S.i=0;render();}},'✕ Back to all questions')));
  return c;
}

/* ---- pages ---- */
function home(){
  const done = Object.keys(mem.done).length, right = Object.values(mem.done).filter(d=>d.ok).length, wrong = done-right;
  const chk = Q.filter(q=>q.check).length;
  const r = el('div',{class:'page'});
  const nums = [[Q.length,'questions','s1'],[done,'attempted','s2'],[chk,'answers to double-check','s3'],[Object.keys(LEC).length-1,'lectures','s4']];
  const stats = el('div',{class:'stats'}, nums.map(([n,l,c]) => { const b = el('b',{},'0'); setTimeout(()=>countUp(b,n),150); return el('div',{class:'stat '+c}, b, l); }));
  r.append(stats);
  const pct = done ? Math.round(right/done*100) : 0, C = 2*Math.PI*44;
  const ring = el('div',{class:'card ring'});
  ring.innerHTML = `<svg width="110" height="110" viewBox="0 0 110 110"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#c8962e"/></linearGradient></defs>
    <circle class="bg" cx="55" cy="55" r="44" fill="none" stroke-width="11"/>
    <circle class="fg" cx="55" cy="55" r="44" fill="none" stroke-width="11" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 55 55)"/>
    <text x="55" y="61" text-anchor="middle" font-size="22" font-weight="800" fill="#064e46">${pct}%</text></svg>`;
  setTimeout(()=>{ const f = ring.querySelector('.fg'); if(f) f.style.strokeDashoffset = C*(1-pct/100); }, 200);
  const side = el('div',{style:'flex:1;min-width:200px'}, el('h3',{},'Your progress'),
    el('div',{class:'hint'}, done ? `${right} right · ${wrong} to revisit · ${Q.length-done} not tried yet` : 'Nothing attempted yet. Bismillah, start with any question.'),
    el('div',{class:'btnrow'},
      el('button',{class:'btn pri',onclick:()=>{S.quiz=null;S.lec='all';S.type='all';S.show='all';S.q='';
        const li = mem.last ? Q.findIndex(x=>x.id===mem.last) : 0; S.i = Math.max(0,li); go('practice',true);}}, done ? 'Continue where I stopped' : 'Start practising'),
      el('button',{class:'btn gold',onclick:()=>{ const pool = Q.filter(q=>!mem.done[q.id]); const src = (pool.length>=10?pool:Q).slice().sort(()=>Math.random()-.5).slice(0,10).map(q=>q.id);
        S.quiz = src; S.lec='all';S.type='all';S.show='all';S.q=''; go('practice'); }}, '🎲 Random 10'),
      wrong ? el('button',{class:'btn',onclick:()=>{S.quiz=null;S.show='wrong';S.lec='all';S.type='all';S.q='';go('practice');}}, `Redo ${wrong} wrong`) : null));
  ring.append(side); r.append(ring);

  r.append(el('div',{class:'card'}, el('h3',{},'How to use this site'),
    el('p',{},'Open ', el('b',{},'Practice'), ', answer each question (for MTF mark every statement True or False), then tap ', el('b',{},'Check my answer'), '. You will see the correct answer, why, where it comes from, and how sure we are.'),
    el('p',{}, el('span',{class:'b ok'},'✓ Accepted answer'), ' the lecture clearly supports it. ', el('span',{class:'b chk'},'⚠ Check this one'), ' the lecture and textbook differ, or the wording is unclear. Our best answer is shown, and the doubtful options are marked.'),
    el('p',{class:'hint'},'Hot topics shows what the examiners repeat. Your progress is saved on this device.')));
  r.append(el('div',{class:'card'}, el('h3',{},'Pick a lecture'),
    el('div',{class:'chips'}, LORDER.filter(k=>Q.some(q=>q.lecture===k)).map(k => el('span',{class:'chip',style:`--c:${lc(k)}`,onclick:()=>{S.quiz=null;S.lec=k;S.type='all';S.show='all';S.q='';go('practice');}}, `${LEC[k]} · ${Q.filter(q=>q.lecture===k).length}`)))));
  return r;
}
function practice(){
  const r = el('div',{class:'page'}); r.append(filterCard(true));
  let l = baseList();
  if (S.show==='wrong') l = l.filter(q => mem.done[q.id] && !mem.done[q.id].ok);
  if (S.show==='flag') l = l.filter(q => mem.flag[q.id]);
  if (S.show==='todo') l = l.filter(q => !mem.done[q.id]);
  curLen = l.length; r.append(viewer(l, S.show==='wrong'?'Nothing wrong yet. Mashaa Allah!':'No questions match these filters.')); return r;
}
function listPage(title, blurb, list, empty){
  const r = el('div',{class:'page'});
  r.append(el('div',{class:'card'}, el('h2',{},title), el('p',{class:'hint',style:'margin:0'},blurb)), filterCard(false));
  const base = new Set(baseList().map(q=>q.id)); const l = list.filter(q=>base.has(q.id));
  curLen = l.length; r.append(viewer(l, empty)); return r;
}
function jump(id){ S.quiz=null; S.lec='all'; S.type='all'; S.show='all'; S.q=''; S.i = Q.findIndex(x=>x.id===id); go('practice',true); }
function hot(){
  const r = el('div',{class:'page'});
  r.append(el('div',{class:'card'}, el('h2',{},'🔥 Hot topics'), el('p',{class:'hint',style:'margin:0'},'Ideas the examiners ask again and again, in different words. The number is how many times the topic appears in the past paper. Tap a question to practise it.')));
  const box = el('div',{class:'hot'});
  for (const g of D.groups) box.append(el('div',{class:'card hotitem'}, el('div',{class:'times'}, g.times+'×'),
    el('div',{}, el('b',{}, g.name), el('small',{}, g.tip), el('div',{}, g.ids.map(i => el('a',{class:'q',onclick:()=>jump(i)}, 'Q'+i))))));
  r.append(box);
  const rep = Q.filter(isRep);
  if (rep.length) r.append(el('div',{class:'card'}, el('h3',{},'Printed more than once, word for word'),
    el('p',{class:'hint'},'The same question appeared in more than one batch (options sometimes shuffled). The answer is identical each time.'),
    rep.map(q => el('div',{style:'margin:6px 0'}, el('a',{class:'q',onclick:()=>jump(q.id)},'Q'+q.id), q.topic, el('span',{class:'hint'},' · '+[q.batch].concat(q.printedAlso).join(' + '))))));
  return r;
}
function notes(){
  const r = el('div',{class:'page'}); const keys = Object.keys(D.notes);
  r.append(el('div',{class:'card'}, el('h2',{},'📚 Notes'), el('p',{class:'hint',style:'margin:0'}, keys.length ? 'Exam-oriented notes from the lecture slides.' : 'Exam-oriented notes for each lecture are on the way, in shaa Allah. Meanwhile, practise each lecture below.')));
  if (keys.length) {
    const cur = S.note && D.notes[S.note] ? S.note : keys[0];
    r.append(el('div',{class:'chips'}, keys.map(k => el('span',{class:'chip'+(k===cur?' on':''),onclick:()=>{S.note=k;render();}}, k.replace(/_/g,' ')))), el('div',{class:'card notes'}, md(D.notes[cur])));
  } else {
    r.append(el('div',{class:'lecgrid'}, LORDER.filter(k=>k!=='T').map(k => el('div',{class:'lec',style:`--lc:${lc(k)}`}, el('b',{}, LEC[k]), el('div',{class:'hint'}, Q.filter(q=>q.lecture===k).length+' past-paper questions'),
      el('span',{class:'notesoon'},'Notes coming soon'), el('div',{class:'btnrow'}, el('button',{class:'btn',onclick:()=>{S.quiz=null;S.lec=k;S.type='all';S.show='all';S.q='';go('practice');}}, 'Practise →'))))));
  }
  return r;
}
function md(t){
  const box = el('div'); let ul = null;
  const inl = s => { const f = document.createDocumentFragment(); s.split(/(\*\*[^*]+\*\*)/).forEach(p => f.append(/^\*\*/.test(p) ? el('b',{},p.slice(2,-2)) : p)); return f; };
  for (const ln of t.split('\n')) { let m;
    if ((m = ln.match(/^(#{1,3})\s+(.*)/))) { ul=null; box.append(el('h'+(m[1].length+1),{}, m[2])); }
    else if ((m = ln.match(/^\s*[-*]\s+(.*)/))) { if(!ul){ul=el('ul');box.append(ul);} ul.append(el('li',{}, inl(m[1]))); }
    else if (ln.trim()) { ul=null; box.append(el('p',{}, inl(ln))); } }
  return box;
}

/* ---- render ---- */
function render(keep){
  const app = document.getElementById('app');
  const f = keep && document.activeElement && document.activeElement.type==='search' ? document.activeElement : null; const pos = f ? f.selectionStart : 0;
  let v;
  switch (S.tab) {
    case 'home': v = home(); break;
    case 'practice': v = practice(); break;
    case 'hot': v = hot(); break;
    case 'accepted': v = listPage('✅ Accepted answers','Questions where the lecture clearly supports the answer. These are the safest to learn first.', Q.filter(q=>!q.check), 'No accepted questions match.'); break;
    case 'verify': v = listPage('⚠ Answers to double-check','The lecture and textbook differ, or the question wording is unclear. We show our best answer and mark the doubtful options. Confirm these with your lecturer if you can.', Q.filter(q=>q.check), 'Nothing to double-check here.'); break;
    case 'notes': v = notes(); break;
  }
  if (keep) v.style.animation = 'none';
  app.replaceChildren(v);
  if (f) { const n = app.querySelector('input[type=search]'); if (n) { n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} } }
}
drawTabs(); render();
</script>
